<title>Pitch & Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></noscript>
<style>
:root{
  --bg:#F2F7F4; --surface:#FFFFFF; --surface2:#EAF2ED; --surface3:#DCEAE2; --ink:#10241D; --ink2:#4F685E; --line:#D9E6DF; --line2:#7F9A8E;
  --accent:#0A7F62; --accent-ink:#0A7458; --accent-soft:#D6F3E8; --on-accent:#FFFFFF; --glow:rgba(10,127,98,.22);
  --p:#2F6FED; --c:#B07309; --f:#D9544B; --fib:#7A5BC9;
  --good:#0A7F62; --ok:#258C80; --warn:#B07309; --bad:#D9544B;
  --arc-glow:none; --halo:none; --halo-sm:none;
  --display:'Barlow Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(16,36,29,.05),0 10px 28px rgba(16,36,29,.09);
  color-scheme:only light;
}
:root[data-theme="dark"]{
  --bg:#0A1410; --surface:#111E18; --surface2:#182A20; --surface3:#203528; --ink:#EAF5EF; --ink2:#8FB0A1; --line:#223A2D;
  --accent:#3EE6B0; --accent-ink:#3EE6B0; --accent-soft:#113D2E; --on-accent:#04150E; --glow:rgba(62,230,176,.35); --line2:#567C68;
  --arc-glow:drop-shadow(0 0 8px var(--glow)); --halo:0 0 14px var(--glow); --halo-sm:0 0 10px var(--glow);
  --p:#6FA3FF; --c:#F2B84B; --f:#FF7B6E; --fib:#B99CFF;
  --good:#3EE6B0; --ok:#4DB8AA; --warn:#F2B84B; --bad:#FF7B6E;
  --shadow:0 2px 4px rgba(0,0,0,.35),0 14px 36px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.app{max-width:540px;margin:0 auto;min-height:100dvh;padding:0 0 calc(100px + env(safe-area-inset-bottom));position:relative;overflow-x:clip}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.brand{font-family:var(--display);font-weight:800;font-size:21px;display:flex;align-items:center;gap:9px;text-transform:uppercase;letter-spacing:.05em;flex:none;white-space:nowrap}
.brand .mark{width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--halo)}
.hright{display:flex;align-items:center;gap:8px;min-width:0}
.lvlchip{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 11px;border-radius:999px;background:var(--surface2);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.03em;border:1px solid var(--line)}
.lvlchip[hidden]{display:none}
.lvlchip b{color:var(--accent-ink)}
.iconbtn{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* sticky macro strip */
.strip{position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:15;margin:0 10px;padding:10px 12px;border-radius:14px;background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;box-shadow:var(--shadow)}
.strip[hidden]{display:none}
.strip .sk{display:flex;flex-direction:column;line-height:1}
.strip .sk .num{font-size:26px}
.strip .sk .num.over{color:var(--bad)}
.strip .sk span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:600;margin-top:2px}
.strip .sm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mb{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--ink2)}
.mb .t{display:flex;justify-content:space-between;font-weight:600}
.mb .t b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.mb .bar{height:5px}
.mb .bar>i{background:var(--mc)}
main{padding:12px 16px 0;display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px}
.view[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.lift{box-shadow:var(--shadow)}
.card.glow{background:radial-gradient(120% 90% at 100% 0%,var(--accent-soft) 0%,var(--surface) 55%)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.muted{color:var(--ink2)}.small{font-size:13px}.xs{font-size:12px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 0}
.sechead h2{font-size:22px}
/* date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:6px}
.datenav .dl{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em}
.datenav .dl small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:0}
.datenav .nb{display:flex;gap:6px}
.datenav .nb button{width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-size:20px;display:grid;place-items:center}
.datenav .nb button.today{width:auto;padding:0 12px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em}
/* gauge hero */
.gauge{display:grid;grid-template-columns:1fr;justify-items:center;position:relative}
.gauge svg{width:min(100%,264px);height:auto;display:block}
.gauge .gbg{stroke:var(--surface3);fill:none;stroke-width:16;stroke-linecap:round}
.gauge .gfg{stroke:var(--accent);fill:none;stroke-width:16;stroke-linecap:round;filter:var(--arc-glow);transition:stroke-dashoffset .6s ease}
.gauge .gfg.over{stroke:var(--bad)}
.gauge .gc{position:absolute;top:34%;text-align:center;display:flex;flex-direction:column;align-items:center}
.gauge .gc .num{font-size:54px;line-height:.9;letter-spacing:-.01em}
.gauge .gc .num.over{color:var(--bad)}
.gauge .gc .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:600;margin-top:4px}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-6px}
.gstat{text-align:center;padding:8px 4px;border-radius:12px;background:var(--surface2)}
.gstat .v{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.gstat .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-weight:600;margin-top:3px}
/* macro rings */
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px}
.mring{display:flex;flex-direction:column;align-items:center;gap:4px}
.mring svg{width:68px;height:68px;transform:rotate(-90deg)}
.mring circle{fill:none;stroke-width:6;stroke-linecap:round}
.mring .b{stroke:var(--surface3)}
.mring .f{stroke:var(--mc);transition:stroke-dashoffset .6s ease}
.mring .wrap{position:relative;display:grid;place-items:center}
.mring .wrap .v{position:absolute;font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.mring .k{font-size:12px;font-weight:600;color:var(--ink)}
.mring .k b{color:var(--ink2);font-weight:500}
/* quests */
.quests{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;padding:2px 2px 6px;scrollbar-width:none;-ms-overflow-style:none}
.quests::-webkit-scrollbar{display:none}
.quest{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px 9px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.quest .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink2);display:grid;place-items:center;font-size:12px;color:var(--on-accent)}
.quest.done{border-color:var(--accent);background:var(--accent-soft)}
.quest.done .ck{background:var(--accent);border-color:var(--accent)}
.quest .pts{color:var(--ink2);font-weight:500;font-size:12px}
.prompt textarea{min-height:64px;font-size:15px}
.card.slim{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 16px}
.slimtxt{display:flex;flex-direction:column;min-width:0}
.slimtxt b{font-family:var(--display);font-size:16px;font-weight:700}
.slimtxt .xs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datenav .nb .wchip{width:auto;padding:0 12px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.03em;color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
.gline{text-align:center;font-size:12.5px;color:var(--ink2);margin-top:-2px}
.gline b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.strip.float{position:fixed;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px;max-width:520px;margin:0 auto;transform:translateY(-130%);opacity:0;transition:transform .25s ease,opacity .25s ease;pointer-events:none}
.strip.float.show{transform:none;opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.strip.float{transition:none}}
/* game board */
.board .top3{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.board .sc{display:flex;flex-direction:column;line-height:1}
.board .sc .num{font-size:42px;letter-spacing:-.01em}
.board .sc .num small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--ink2);letter-spacing:0}
.board .sc span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2);font-weight:600;margin-top:4px}
.segbar{display:flex;gap:3px;height:14px;margin:14px 0 10px}
.segbar .sgm{position:relative;background:var(--surface3);border-radius:5px;overflow:hidden}
.segbar .sgm i{position:absolute;left:0;top:0;bottom:0;background:var(--sc);border-radius:5px;transition:width .5s ease}
.segbar .sgm.full{box-shadow:inset 0 0 0 1px var(--sc)}
.seglegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--ink2)}
.seglegend span{display:inline-flex;align-items:center;gap:5px}
.seglegend i{width:8px;height:8px;border-radius:2px;background:var(--sc);display:inline-block}
.seglegend b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.mring{cursor:pointer;border-radius:12px;padding:4px 0}
.mring .left{font-size:11px;font-weight:700;color:var(--mc);color:color-mix(in srgb,var(--mc) 65%,var(--ink));font-variant-numeric:tabular-nums}
.mring .left.over{color:var(--bad);color:color-mix(in srgb,var(--bad) 65%,var(--ink))}
.mring .pts{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface3);color:var(--ink2);font-family:var(--display);letter-spacing:.03em}
.mring .pts.on{background:var(--accent);color:var(--on-accent);box-shadow:var(--halo-sm)}
/* season */
.season{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:78px;height:78px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bg{stroke:var(--surface3)}
.ring .fg{stroke:var(--accent);filter:var(--arc-glow);transition:stroke-dashoffset .6s ease}
.ring .n{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.ring .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600}
.lvl{display:flex;flex-direction:column;gap:6px;min-width:0}
.lvl .row{min-width:0}
.lvl .t{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl .xp{height:8px;border-radius:999px;background:var(--surface3);overflow:hidden}
.lvl .xp i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--fib));border-radius:999px}
.lvl .m{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.streak{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);flex:none;font-weight:800;font-size:14px;font-family:var(--display);letter-spacing:.03em}
.streak svg{width:14px;height:14px;fill:currentColor}
.hint{font-size:13px;color:var(--ink2);margin-top:12px;line-height:1.5}
.hint b{color:var(--ink)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;background:var(--surface2);text-align:center;min-height:92px}
.badge .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:15px;box-shadow:var(--halo)}
.badge .nm{font-size:11px;font-weight:600;line-height:1.2}
.badge .ds{font-size:10px;color:var(--ink2);line-height:1.2}
.badge.locked{filter:grayscale(1)}
.badge.locked .ic{opacity:.35;box-shadow:none}
.badge.locked .nm,.badge.locked .ds{color:var(--ink2)}
.chal .bar{height:9px}
/* bars */
.bar{height:10px;border-radius:999px;background:var(--surface3);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .35s ease}
.bar>i.over{background:var(--bad)}
/* buttons/inputs */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:13px;padding:11px 15px;font-weight:600;font-size:14px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);white-space:nowrap;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 4px 12px var(--glow)}
.btn.ghost{background:transparent}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:10px;min-height:40px}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);color:color-mix(in srgb,var(--bad) 65%,var(--ink))}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.actions .btn{flex-direction:row;gap:8px;padding:12px 10px;font-size:13px;min-height:54px;justify-content:flex-start;white-space:normal;text-align:left;line-height:1.2}
.actions .btn svg{width:22px;height:22px}
input[type=number],input[type=text],input[type=date],input[type=time],input[type=search],input[type=password],select,textarea{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;width:100%;min-width:0;color:var(--ink);font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* meals timeline */
.meal{padding:0;overflow:hidden}
.meal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px}
.meal .mh h3{font-size:20px}
.meal .mh .kc{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:4px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:12px 12px 12px 18px;border-top:1px solid var(--line)}
.item>div{min-width:0}
.item .dot{width:4px;height:34px;border-radius:2px;background:var(--sc,var(--line))}
.item .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.item .sub i{font-style:normal;padding:1px 6px;border-radius:6px;background:var(--surface2)}
.item .kc{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.item .del{width:44px;height:44px;border-radius:10px;color:var(--ink2);display:grid;place-items:center;font-size:20px}
.item .del:hover{background:var(--surface2);color:var(--bad)}
.item.empty{grid-template-columns:1fr;color:var(--ink2);font-size:13px;padding:6px 16px 12px;border-top:0}
.addrow{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.msec{border-top:1px solid var(--line)}
.msh{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 14px 4px 18px;font-size:14.5px}
.msh b{font-weight:600}
.msact{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--ink)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.diary .item{padding-left:18px}
.actions.three{grid-template-columns:repeat(3,1fr)}
.actions.three .btn{flex-direction:column;gap:6px;font-size:12.5px;padding:10px 6px;text-align:center}
/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:20}
.tabbar .inner{pointer-events:auto;width:100%;max-width:540px;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;background:var(--surface);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom));gap:4px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--accent-ink)}
.tabbar button.scan{color:var(--on-accent);background:var(--accent);border-radius:16px;margin-top:-22px;box-shadow:0 6px 18px var(--glow);padding:12px 2px 9px}
.tabbar button.scan svg{width:26px;height:26px}
/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:13px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{padding:11px 6px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,36,29,.14)}
.mealseg button{font-size:13px;padding:10px 4px}
.mealseg button.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.verdict{border-left:3px solid var(--vc);background:var(--surface2);background:color-mix(in srgb,var(--vc) 10%,var(--surface));padding:10px 12px;border-radius:0 12px 12px 0;font-size:14px;line-height:1.45}
.verdict b{color:var(--vc);font-weight:700}
.pane[hidden]{display:none}
.pane{display:flex;flex-direction:column;gap:12px}
/* scanner */
.scanbox{position:relative;aspect-ratio:4/3;background:#060b09;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .bg{position:absolute;inset:0;background:rgba(3,8,6,.6)}
.sheet .panel{position:relative;width:100%;max-width:540px;max-height:92dvh;overflow:auto;overscroll-behavior:contain;scroll-padding-bottom:16px;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}

.reasons li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rc);flex:none;transform:translateY(-1px)}
.preview{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface2);border-radius:14px;padding:10px 14px}

/* exercise */
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.lifts{display:flex;flex-direction:column}

.chart{width:100%;height:auto;display:block}

.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--fib);stroke-dasharray:5 4;stroke-width:1.5}
.chart .proj{stroke:var(--accent);stroke-dasharray:2 4;stroke-width:1.8;fill:none}
.chart .line{stroke:var(--ink);stroke-width:2.2;fill:none}

.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .tgt{stroke:var(--ink);stroke-width:2;opacity:.8}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hits{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.hits i{display:block;height:6px;border-radius:3px;background:var(--surface3)}
.hits i.on{background:var(--hc)}
/* coach */
.coach-last{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;font-size:13.5px;white-space:pre-wrap;max-height:150px;overflow:auto}
.thread{display:flex;flex-direction:column;gap:8px;max-height:48dvh;overflow:auto;overscroll-behavior:contain;padding:2px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;line-height:1.4}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.msg.a.wait{color:var(--ink2);font-style:italic}
.coachbar{display:flex;gap:8px;align-items:flex-end}
.coachbar textarea{flex:1;resize:none;min-height:46px;max-height:120px}
/* protein picks */
.pick{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pick:first-child{border-top:0}
.pick .nm{font-weight:600;font-size:14px}
.pick .sub{font-size:12px;color:var(--ink2);margin-top:2px}
.pick .eu{font-family:var(--display);font-weight:700;font-size:16px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.micbtn{position:relative;width:46px;padding:0}
.micbtn.listening{background:var(--bad);color:#fff;border-color:transparent;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
.pickrow{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pickrow:nth-of-type(2){border-top:0}
.pickrow input{padding:8px 10px;font-size:14px;border-radius:9px}
.pickrow .pk{text-align:right;font-family:var(--display);font-weight:700;font-size:17px}
.pickrow .del{width:36px;height:36px;border-radius:9px;color:var(--ink2);display:grid;place-items:center;font-size:18px}
.pickrow .qty{display:inline-flex;align-items:center;gap:4px}
.pickrow .qty button{width:36px;height:36px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);font-size:18px;font-weight:600}

.pickrow .exact-list{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.pickrow .exact-list[hidden]{display:none}
.hidden{display:none!important}
.plancard .big{font-size:40px;line-height:1}
.plancard .arrow{color:var(--accent)}
.grp{padding:14px 0 4px;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0;padding-top:4px}
details.card>summary{padding:2px 0}
details.card[open]>summary{margin-bottom:10px}
.wiz{display:flex;flex-direction:column;gap:16px;min-height:60dvh}
.wiz .dots{display:flex;gap:6px}
.wiz .dots i{width:8px;height:8px;border-radius:50%;background:var(--surface3)}
.wiz .dots i.on{background:var(--accent);width:22px;border-radius:4px}
.wiz h2{font-size:30px;line-height:1.05}

.opts{display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;width:100%}

.opt span{font-size:12.5px;color:var(--ink2);display:block;margin-top:2px}
.opt .tag{flex:none;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.bigin{display:flex;align-items:baseline;gap:8px;background:var(--surface2);border:1px solid var(--line2);border-radius:16px;padding:6px 16px}
.bigin input{background:transparent!important;border:0!important;padding:8px 0!important;font-family:var(--display);font-size:38px;font-weight:700;text-align:left;width:100%}
.bigin span{font-size:14px;color:var(--ink2);font-weight:600}

.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;font-weight:600;color:var(--ink2)}
.track{position:relative;height:70px;margin:16px 4px 4px}
.track .rail{position:absolute;left:0;right:0;top:30px;height:12px;border-radius:999px;background:var(--surface3)}

.msl{display:flex;flex-direction:column}
.msr{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.msr:first-child{border-top:0}

.foodguide ul{margin:6px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.foodguide h3{font-size:17px}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}

function routeInput(text){
  const s=text.toLowerCase().trim();
  const wm=s.match(/^(?:i\s+)?(?:weigh(?:ed)?|weight|gewogen|ik weeg|weeg|scale)?\s*(\d{2,3}(?:[.,]\d)?)\s*(?:kg|kilo|kilos)?\s*$/)||s.match(/\b(\d{2,3}(?:[.,]\d)?)\s*(?:kg|kilo)\b/);
  const foodish=findFoods(correctTypos(s)).length>0;
  if(wm&&!foodish){const v=parseFloat(wm[1].replace(',','.'));if(v>=35&&v<=300){day(cur).weight=v;save();buzz();render();toast(`Saved ${v} kg`);setTimeout(checkCelebrations,400);return}}
  const q=/\?$/.test(s)||/^(what|should|can|could|how|why|which|is it|am i|do i|wat|moet|kan|hoe|waarom|welke)\b/.test(s)||/\b(hungry|honger|craving|advice|tip|suggest|recommend)\b/.test(s);
  if(q){openCoach(text);return}
  const act=parseActivity(text,latestWeight());
  const exVerb=/\b(ran|run|running|walked|walk|cycled|biked|bike|e-?bike|bakfiets|gym|football|voetbal|training|trained|workout|swam|swim|sauna|padel|tennis|hiit|legday|leg day|hardgelopen|gefietst|gewandeld|getraind)\b/.test(s);
  if(act&&(exVerb||!foodish)){openExercise(text);return}
  openSpeak(null,{text});
}

function verdictFor(p,g){
  const n=p.per100;if(!(n.kcal>0))return{tier:'No data',text:'This product has no nutrition data. Add it from the label to be sure.',color:'var(--ink2)'};
  const sc=fitScore(n)??0,T=targetsFor(cur),t=totals(cur);const left=T.kcal-t.kcal,pLeft=T.p-t.p,fibLeft=T.fib-t.fib;
  const kcal=n.kcal*g/100,prot=n.p*g/100;const pDen=n.p/n.kcal*100,fatPct=n.f*9/n.kcal,fibDen=(n.fib||0)/n.kcal*100;
  const neg=[],pos=[];
  if(fatPct>0.4)neg.push(`${r0(fatPct*100)}% of its calories are fat`);
  if(pDen<4)neg.push('almost no protein');else if(pDen<7)neg.push('thin on protein');
  if((n.sug||0)>12)neg.push(`${r1(n.sug)} g sugar per 100 g`);
  if(n.fib!=null&&n.fib<1.5&&n.kcal>150&&pDen<8)neg.push('no fibre');
  if(pDen>=8)pos.push(`${r1(pDen)} g protein per 100 kcal`);
  if(fibDen>=2.5)pos.push(`${r1(n.fib)} g fibre per 100 g`);
  if(fatPct<=0.25)pos.push('low fat');
  let tier,color;if(sc>=75){tier='Good pick.';color='var(--good)'}else if(sc>=55){tier='Fine.';color='var(--ok)'}else if(sc>=35){tier='Not a great option.';color='var(--warn)'}else{tier='Bad option.';color='var(--bad)'}
  let budget;if(left<=0)budget=`You’re already ${fmt(-left)} kcal over today.`;else if(kcal>left)budget=`${g} g is ${fmt(kcal)} kcal, more than the ${fmt(left)} you have left.`;else if(kcal>left*0.5)budget=`${g} g takes ${fmt(kcal)} of your ${fmt(left)} kcal left.`;else budget=`${g} g is ${fmt(kcal)} kcal, fits in your ${fmt(left)} left.`;
  let tip='';if(sc<55){if(pLeft>20)tip='You still need protein: kwark, skyr, eggs or chicken do more for you.';else if(fibLeft>10)tip='Fibre is what you’re short on: beans, lentils or veg instead.';else if(left>0)tip='If you want it, keep it small and stop there.'}
  else if(sc>=75&&pLeft>20)tip=`Good for your protein gap: this gives ${r0(prot)} g.`;
  const why=neg.length?neg.slice(0,2).join(', ')+'.':pos.length?pos.slice(0,2).join(', ')+'.':'';
  return{tier,color,text:`${why} ${budget} ${tip}`.replace(/\s+/g,' ').trim()};
}

function parseActivity(text,w){
  const s=text.toLowerCase().replace(/(\d),(\d)/g,'$1.$2');
  let act=ACT.find(a=>a.re.test(s));
  if(!act){if(/\d+\s*(min|minutes?|minuten|uur|hour)/.test(s))act={re:null,name:text.trim().slice(0,40),met:4,id:'other'};else return null}
  let km=null,min=null,m;
  if(m=s.match(/(\d+(?:\.\d+)?)\s*(?:km|kilometer|kilometre|kilometres|kilometers|k(?![a-z]))/))km=parseFloat(m[1]);
  if(m=s.match(/(\d+(?:\.\d+)?)\s*(?:h\b|hr\b|hrs\b|hour|hours|uur|uren)/))min=parseFloat(m[1])*60;
  if(m=s.match(/(\d+)\s*(?:min\b|mins\b|minutes?|minuten|minuut|m\b)/))min=(min||0)+parseInt(m[1],10);
  if(/half an hour|halfuur|half uur|half hour/.test(s))min=min||30;else if(/\ban hour\b|een uur|1 uur/.test(s))min=min||60;
  if(/\b(twice|2x|two times)\b/.test(s)&&min)min*=2;
  let pace=null;if(m=s.match(/(\d{1,2})[:.](\d{2})\s*(?:\/|per|min\/)\s*km/))pace=parseInt(m[1],10)+parseInt(m[2],10)/60;
  if(!min&&km&&pace)min=km*pace;
  if(!min&&km&&act.speed)min=km/act.speed*60;
  let met=act.met;
  if(km&&min){const sp=km/(min/60);
    if(act.name==='E-bike')met=sp<18?4:sp<24?4.8:5.5;
    else if(act.id==='cycle')met=sp<12?3.5:sp<16?5:sp<19?6.8:sp<22?8:sp<26?10:12;
    else if(act.id==='run')met=sp<7?7:sp<8.5?8.3:sp<9.5?9:sp<10.5?9.8:sp<12?11:sp<13.5?11.8:13;
    else if(act.id==='walk')met=sp<3.5?2.8:sp<4.5?3.3:sp<5.5?3.8:sp<6.5?5:7;
    else if(act.id==='swim')met=sp<1.5?5:sp<2.5?6:8;}
  if(/\b(hard|fast|intense|snel|hard gefietst|sprint|tempo)\b/.test(s)&&!(km&&min))met*=1.2;
  if(/\b(easy|slow|relaxed|rustig|langzaam|chill)\b/.test(s)&&!(km&&min))met*=0.85;
  const name=act.name+(km?` ${r1(km)} km`:'');
  let assumed=false;
  if(!min){const d=act.id.startsWith('fb')?(S.profile&&S.profile.fbMinutes)||60:(act.id==='gym'||act.id==='hiit')?(S.profile&&S.profile.gymMinutes)||45:act.id==='sauna'?20:null;if(d){min=d;assumed=true}}
  if(!min)return{act,km,min:null,kcal:null,met,name,needMinutes:true};
  const kcal=act.id==='sauna'?0:Math.round(met*w*min/60);
  return{act,km,min:Math.round(min),kcal,met,name,needMinutes:false,assumed};
}

  const gm=s.match(/(\d+(?:\.\d+)?)\s*(?:g|gram|grams|gr|ml)\b/);const adj=ADJ.find(([re])=>re.test(s));const rm=REMOVE.test(s)&&!gm&&!adj;const whole=WHOLE.test(s);
  const seg=parseSegment(s);const explicit=seg.items.find(x=>targets.some(t=>enName(t.f.st)===enName(x._st||'')||x.name===enName(t.f.st)));
  if(!gm&&!adj&&!rm&&!whole&&!/\b(\d+|two|twee|three|drie|four|vier)\b/.test(s))return null;
  const changed=[];
  for(const t of targets.sort((a,b)=>b.i-a.i)){const it=items[t.i];
    if(rm){items.splice(t.i,1);changed.push(`removed ${it.name}`);continue}
    let g=it.grams;
    if(gm)g=parseFloat(gm[1]);
    else if(whole){const u=unitGrams(t.f.st,null,null);g=u||it.grams*2}
    else if(adj)g=it.grams*adj[1];
    else if(seg.items.length){const x=seg.items.find(x=>x.name===enName(t.f.st));if(x)g=x.grams}
    it.grams=Math.max(1,Math.round(g));if(it.unit&&it.unit.g)it.count=Math.round(it.grams/it.unit.g*2)/2;changed.push(`${it.name} → ${qtyText(it)}`)}
  return changed;
}

function ruleMeal(conv){
  const users=conv.filter(m=>m.role==='user');
  const all=[];const unknown=[];let lastChanged=null;
  for(const u of users){if(all.length){const ch=applyAdjustment(all,u.content);if(ch){lastChanged=ch;continue}}lastChanged=null;const segs=u.content.toLowerCase().split(/[,;\/\n+]|\band\b|\ben\b|\bwith\b|\bmet\b|\bplus\b|\btogether with\b/).map(x=>x.trim()).filter(Boolean);
    for(const seg of segs){const r=parseSegment(seg);const hasQty=/\d|\b(half|halve|slice|slices|glass|glasses|cup|bowl|handful|whole|two|three|four|twee|drie|vier|double|small|large|big)\b/.test(seg);
      for(const it of r.items){let i=all.findIndex(a=>a.name===it.name);if(i>=0&&!hasQty)continue;if(i<0){const cat=GENERIC[it._key];if(cat&&CATRE[cat]){const j=all.findIndex(a=>CATRE[cat].test(a._st||''));if(j>=0){if(it.grams&&r.items.length===1&&/\d/.test(seg))all[j].grams=it.grams;continue}}}if(i>=0)all[i]=it;else all.push(it)}unknown.push(...r.unknown)}}
  /* 'N g of the X' phrasing: assign grams to the named food wherever it appears */
  const gramMap=[];for(const u of users){const low=correctTypos(u.content.toLowerCase());const re=/(\d+(?:\.\d+)?)\s*(?:g|gram|grams|gr)\b\s*(?:of\s+)?(?:the\s+|my\s+)?([a-zà-ü][a-zà-ü ]{2,30}?)(?=[,.;]|\s+(?:and|en|with|met|plus)\b|$)/g;let m;while((m=re.exec(low))){const fs=findFoods(m[2]);if(fs.length)gramMap.push({st:fs[0].st,key:fs[0].key,g:parseFloat(m[1])})}}
  for(const gm of gramMap){let it=all.find(i=>i._st===gm.st.name);if(!it){const cat=GENERIC[gm.key];if(cat&&CATRE[cat])it=all.find(i=>CATRE[cat].test(i._st||''))}if(it){it.grams=Math.round(gm.g);if(it.unit&&it.unit.g)it.count=Math.round(it.grams/it.unit.g*2)/2;else{it.unit=null;it.count=null}}}
  const uniqUnknown=[...new Set(unknown)].filter(w=>!/^(sandwich|broodje|tosti|boterham|wrap|salad|salade|bowl|burger|pizza|curry|stamppot|soup|soep|lunch|dinner|breakfast|snack|meal|something|things)$/.test(w)).slice(0,4);
  const text=users.map(m=>m.content).join(' ').toLowerCase();
  const composite=/sandwich|broodje|tosti|boterham|bowl|burger|salad|salade/.test(text);
  const askedBefore=conv.some(m=>m.role==='assistant'&&/\?/.test(m.content));
  let question=null;
  if(!askedBefore&&all.length<=2&&(composite||!all.length))question=composite?'What was on or in it? Bread type, meat or cheese, sauce, anything else?':'What exactly did you have, and roughly how much?';
  const reply=lastChanged?`Updated: ${lastChanged.join(', ')}. Anything else, or add it.`:all.length?`Got it: ${all.map(i=>`${i.name} (${qtyText(i)})`).join(', ')}. Tell me what to change (“the beets were much less”, “no mayo”, “chicken 60 g”) or add it.${uniqUnknown.length?` I don’t know “${uniqUnknown.join('”, “')}” offline, add those by scanning or on the Manual tab.`:''}`:'I couldn’t match that to anything I know offline.';
  return{reply,question:lastChanged?null:question,items:all.map(({name,grams,per100,unit,count,_st})=>({name,grams,per100,unit,count,_st}))};
}

async function parseMeal(conv){
  const sm=await getSample();
  if(sm){const turns=conv.map((m,i)=>({role:m.role,content:i===0?MEAL_SYSTEM+'\n\nIVAN SAYS: '+m.content:m.content}));try{return await sm.json(turns,{modelTier:'default',cache:false})}catch(e){const r=await sm(turns,{cache:false});return extractJSON(r.text)}}
  if(S.settings.apiKey){const t=await askClaudeAPI(S.settings.apiKey,MEAL_SYSTEM,conv.map(m=>({role:m.role,content:m.content})));return extractJSON(t)}
  return ruleMeal(conv);
}

function kcalChart(days){
  const W=360,H=170,L=34,R=10,T=14,B=24;const n=days.length;
  const data=days.map(d=>{const has=S.days[d]&&S.days[d].foods.length;return{d,has,k:has?totals(d).kcal:0,T:targetsFor(d).kcal,p:has?totals(d).p:0,Tp:targetsFor(d).p}});
  const maxV=Math.max(...data.map(x=>Math.max(x.k,x.T)))*1.12||2000;
  const X=i=>L+(i+0.5)*(W-L-R)/n,Y=v=>T+(1-v/maxV)*(H-T-B);const bw=(W-L-R)/n*0.58;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day vs target"><defs><linearGradient id="gk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".45"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--bad)"/><stop offset="1" stop-color="var(--bad)" stop-opacity=".45"/></linearGradient></defs>`;
  const step=maxV>3000?1000:500;for(let v=step;v<maxV;v+=step)s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-5}" y="${Y(v)+3.5}" text-anchor="end">${v>=1000?(v/1000)+'k':v}</text>`;
  data.forEach((x,i)=>{const cx=X(i);if(x.has){const over=x.k>x.T*1.05,under=x.k<x.T*0.8;const h=Math.max(2,Y(0)-Y(x.k));s+=`<rect x="${cx-bw/2}" y="${Y(x.k)}" width="${bw}" height="${h}" rx="4" fill="${over?'url(#gb)':under?'var(--surface3)':'url(#gk)'}" ${under?'stroke="var(--accent)" stroke-width="1.5"':''}/>`}else s+=`<rect x="${cx-bw/2}" y="${Y(0)-2}" width="${bw}" height="2" rx="1" fill="var(--surface3)"/>`;
    s+=`<line class="tgt" x1="${cx-bw/2-3}" x2="${cx+bw/2+3}" y1="${Y(x.T)}" y2="${Y(x.T)}"/>`;
    const dd=parseYmd(x.d);s+=`<text x="${cx}" y="${H-7}" text-anchor="middle" ${x.d===ymd(new Date())?'style="fill:var(--accent);font-weight:700"':''}>${n>14?(dd.getDate()%5===0||i===n-1?dd.getDate():''):DOW[dd.getDay()][0]}</text>`});
  return s+'</svg>';
}
function macroPctChart(days){

  for(const v of [50,100]){s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" ${v===100?'style="stroke:var(--ink);opacity:.5;stroke-dasharray:4 4"':''}/><text x="${L-5}" y="${Y(v)+3.5}" text-anchor="end">${v}%</text>`}
  const line=(k,col,grad)=>{if(pts.length<1)return '';const path=pts.map((q,j)=>`${j?'L':'M'}${X(q.i)} ${Y(q[k])}`).join(' ');const area=path+` L${X(pts[pts.length-1].i)} ${Y(0)} L${X(pts[0].i)} ${Y(0)} Z`;return `<path d="${area}" fill="url(#${grad})"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`+pts.map(q=>`<circle cx="${X(q.i)}" cy="${Y(q[k])}" r="3" fill="${col}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')};

}

/* ---------- JOURNEY ---------- */
function weightSeries(){const P=S.profile;const ws=Object.keys(S.days).filter(d=>S.days[d].weight>0).sort().map(d=>({d,kg:S.days[d].weight}));return [{d:P.startDate,kg:P.startWeight},...ws.filter(w=>w.d!==P.startDate)].sort((a,b)=>a.d<b.d?-1:1)}
function weightChartSvg(pts,pl){

  svg+=`<line class="goal" x1="${L}" x2="${W-R}" y1="${Y(P.goalWeight)}" y2="${Y(P.goalWeight)}"/><text x="${L+4}" y="${Y(P.goalWeight)-5}" text-anchor="start" style="fill:var(--fib)">goal ${P.goalWeight} kg</text>`;
  const d0=new Date(x0);d0.setDate(1);d0.setMonth(d0.getMonth()+1);

  if(goalT>=x0&&goalT<=x1)svg+=`<line x1="${X(goalT)}" x2="${X(goalT)}" y1="${T}" y2="${H-B}" style="stroke:var(--ink2);stroke-dasharray:2 3"/><text x="${clamp(X(goalT),L+44,W-R-44)}" y="${T-4}" text-anchor="middle">${MON[new Date(goalT).getMonth()]} ${new Date(goalT).getDate()} · ${r1(pl.atGoalDate)} kg</text>`;

function weeklyTrend(){const t=ymd(new Date());const avg=(from,to)=>{let s=0,n=0;for(let d=from;d<=to;d=addDays(d,1)){const D=S.days[d];if(D&&D.weight>0){s+=D.weight;n++}}return n?{v:s/n,n}:null};const a=avg(addDays(t,-6),t),b=avg(addDays(t,-13),addDays(t,-7));if(!a||!b)return null;return{delta:a.v-b.v,na:a.n,nb:b.n}}

  const ms=[2,5,10].map(k=>({k:'l'+k,name:`−${k} kg`,w:P.startWeight-k})).concat([{k:'half',name:'Halfway',w:P.startWeight-total/2},{k:'goal',name:`Goal · ${P.goalWeight} kg`,w:P.goalWeight}]).filter(m=>m.w>=P.goalWeight-0.01).sort((a,b)=>b.w-a.w);
  const seen=new Set();const uniq=ms.filter(m=>{const key=r1(m.w);if(seen.has(key))return false;seen.add(key);return true});
  const reachedOn=w=>{for(const p of pts){if(p.kg<=w+0.001)return p.d}return null};
  const eta=w=>{if(last.kg<=w)return null;const wk=(last.kg-w)/pl.effRate;const d=new Date(Math.max(parseYmd(last.d).getTime(),Date.now())+wk*7*864e5);return d};
  const bmi=r1(last.kg/((P.height/100)**2));
  const trackMs=uniq.map(m=>({...m,x:clamp((P.startWeight-m.w)/total*100,0,100),hit:!!reachedOn(m.w)})).sort((a,b)=>a.x-b.x);let lastLx=-100;trackMs.forEach(m=>{m.showLabel=m.k!=='goal'&&m.x-lastLx>=9&&m.x<=92;if(m.showLabel)lastLx=m.x});
  const html=`
  <div class="sechead"><h2>Your journey</h2><button class="btn sm" id="editplan">Edit plan</button></div>
  <div class="card lift glow">
    <div class="row between" style="align-items:flex-start"><div><div class="eyebrow">Lost so far</div><div class="num" style="font-size:52px;line-height:1;color:${lost>0?'var(--accent-ink)':'var(--ink)'}">${lost>0?'−':''}${r1(Math.abs(lost))}<span class="small muted" style="font-family:var(--body);font-weight:500"> kg</span></div></div><div style="text-align:right"><div class="eyebrow">To go</div><div class="num" style="font-size:32px;line-height:1.1">${r1(toGo)}<span class="small muted" style="font-family:var(--body);font-weight:500"> kg</span></div><div class="xs muted">${r0(pct)}% of the way</div></div></div>
    <div class="track"><span class="lab" style="left:0">${P.startWeight} kg</span><span class="lab" style="right:0">${P.goalWeight} kg</span><div class="rail"></div><div class="fill" style="width:${pct}%"></div>${trackMs.map(m=>`<i class="ms ${m.hit?'hit':''}" style="left:calc(${m.x}% - 1px)"></i>${m.showLabel?`<span class="ml" style="left:${m.x}%">${m.k==='half'?'½':m.name.replace(' kg','')}</span>`:''}`).join('')}<div class="me" style="left:${clamp(pct,4,96)}%">⚽</div></div>
    <div class="stats" style="margin-top:18px"><div class="stat"><div class="v">${last.kg}</div><div class="k">now kg</div></div><div class="stat"><div class="v">${r1(weeksIn)}</div><div class="k">weeks in</div></div><div class="stat"><div class="v" style="color:${trend&&trend.delta<0?'var(--accent-ink)':'var(--ink)'}">${trend?(trend.delta>0?'+':'')+r1(trend.delta):'–'}</div><div class="k">kg this week</div></div><div class="stat"><div class="v" style="font-size:20px">${MON[pl.goalEta.getMonth()]} ${pl.goalEta.getDate()}</div><div class="k">goal eta</div></div></div>
    <p class="small muted" style="margin:12px 0 0">${trend?`7-day average vs the week before. Plan expects −${r1(pl.effRate)} kg a week.`:'Weigh in on a few mornings and the weekly trend appears here. Daily numbers bounce; the 7-day average is the truth.'} BMI ${bmi}.</p>
  </div>
  <div class="card">
    <div class="row between" style="margin-bottom:8px"><h2 style="font-size:22px">Weight</h2><button class="btn sm" id="jweigh">Weigh in</button></div>
    ${weightChartSvg(pts,pl)}
    <p class="xs muted" style="margin:10px 0 0">Dotted line: where ${r1(pl.effRate)} kg a week takes you. ${pl.needRate>pl.safeMax+0.02?`${P.goalWeight} kg by ${longDate(parseYmd(P.goalDate))} would need ${r1(pl.needRate)} kg a week, above the safe ceiling, so the plan runs at ~${pl.safeMax}.`:''}</p>
  </div>
  <div class="card">
    <h2 style="font-size:22px;margin-bottom:6px">Milestones</h2>
    <div class="msl">${uniq.map(m=>{const r=reachedOn(m.w);const e=eta(m.w);return `<div class="msr ${r?'hit':''}"><div class="ic">${r?'✓':m.k==='goal'?'★':m.k==='half'?'½':m.name.replace(' kg','')}</div><div><div class="nm">${m.name}</div><div class="sub">${r1(m.w)} kg</div></div><div class="when">${r?`reached ${niceDate(r)}`:e?`~${MON[e.getMonth()]} ${e.getDate()}${e.getFullYear()!==new Date().getFullYear()?' '+e.getFullYear():''}`:'now'}</div></div>`}).join('')}</div>
  </div>
  <div class="card">
    <div class="row between"><h2 style="font-size:22px">Your targets</h2><span class="small muted">${r1(pl.effRate)} kg / week</span></div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-top:12px"><div class="stat"><div class="v">${fmt(pl.kcalRest)}</div><div class="k">kcal rest</div></div><div class="stat"><div class="v" style="color:var(--accent-ink)">${fmt(pl.kcalRest+7.5*pl.w*P.fbMinutes/60*P.eatBack/100)}</div><div class="k">kcal football</div></div><div class="stat"><div class="v">${fmt(pl.deficit)}</div><div class="k">deficit</div></div></div>
    <div class="stats" style="margin-top:8px"><div class="stat"><div class="v" style="color:var(--p)">${pl.protein}</div><div class="k">protein g</div></div><div class="stat"><div class="v" style="color:var(--fib)">${pl.fiber}</div><div class="k">fibre g</div></div><div class="stat"><div class="v" style="color:var(--c)">${Math.max(50,r0((pl.kcalRest-pl.protein*4-pl.fat*9)/4))}</div><div class="k">carbs rest g</div></div><div class="stat"><div class="v" style="color:var(--f)">${pl.fat}</div><div class="k">fat g</div></div></div>
    <p class="xs muted" style="margin:12px 0 0">Football ${P.fbPerWeek}×${P.fbMinutes} min, gym ${P.gymPerWeek}×${P.gymMinutes} min, eat-back ${P.eatBack}%. Tap Edit plan to change anything.</p>
  </div>
  ${journeyExtras()}`;
  const el=$('#v-plan');el.innerHTML=html;
  $('#editplan').onclick=()=>startWizard(true);$('#jweigh').onclick=openWeigh;
  bindJourneyExtras(el);
}
function journeyExtras(){return `
  <details class="card"><summary><h2 style="font-size:20px">Coach &amp; voice</h2></summary>
    <p class="small muted" style="margin:0 0 10px">${sampleFn?'Inside claude.ai the coach and the voice logger run on Claude automatically.':'On your phone the coach and the voice meal logger use your own Anthropic API key (console.anthropic.com → API keys). It stays in this browser and goes straight to Anthropic; a question costs well under a cent. Without it you get the offline rules.'}</p>
    <div class="row"><input type="password" id="p-key" placeholder="sk-ant-…" value="${esc(S.settings.apiKey||'')}" autocomplete="off"><button class="btn sm" id="p-keysave">Save</button>${S.settings.apiKey?'<button class="btn sm ghost" id="p-keyclear">Remove</button>':''}</div>
    <p class="xs muted" style="margin:8px 0 0">Model: Claude Opus 5. It sees your plan, today's log, training and a cheap-protein and fibre price list before every answer. Voice: Chrome has built-in dictation (the mic buttons). In other browsers, or if it fails, use the mic key on your keyboard, it types into the same box.</p>
  </details>
  <details class="card"><summary><h2 style="font-size:20px">Daily reminders in Google Calendar</h2></summary>
    <p class="small muted" style="margin:0 0 10px">Each button opens Google Calendar on this phone, signed in as you, with a repeating daily reminder pre-filled. Tap Save there once.</p>
    <div style="display:flex;flex-direction:column;gap:8px">${REMINDERS.map(r=>`<div class="row between" style="gap:8px"><span style="flex:1;font-weight:500;font-size:14px">${r.title}</span><input type="time" data-rk="${r.k}" value="${S.reminders[r.k]||r.time}" style="width:118px"><a class="btn sm" target="_blank" rel="noopener" data-ra="${r.k}" href="${gcalUrl({title:r.title,details:'Open Pitch & Plate and log it. Daily reminder.',date:ymd(new Date()),time:S.reminders[r.k]||r.time,dur:10,daily:true})}">Add</a></div>`).join('')}</div>
  </details>
  <details class="card"><summary><h2 style="font-size:20px">Why these numbers · the science</h2></summary>
    <div class="small" style="display:flex;flex-direction:column;gap:8px">
      <p style="margin:0"><b>Deficit capped at ~1% of body weight per week.</b> Faster than that, trials show proportionally more lean-mass loss and worse training performance; 0.5–1% keeps most muscle, especially with high protein and lifting (Garthe 2011; Helms 2014 review).</p>
      <p style="margin:0"><b>Protein ${r1(S.profile.proteinPerKg)} g per kg.</b> Meta-analyses put the range for preserving or building muscle in a deficit at 1.6–2.4 g/kg/day (Morton 2018; Helms 2014). Protein is also the most satiating macro, which is what makes a 1,500 kcal day bearable.</p>
      <p style="margin:0"><b>Fat floor ${r1(S.profile.fatPerKg)} g per kg.</b> Going much below ~0.5 g/kg for long drags down testosterone and mood; fat stays low, not zero, so calories can go to protein and fibre.</p>
      <p style="margin:0"><b>Fibre ${S.profile.fiber} g.</b> The Gezondheidsraad recommends 30–40 g; higher fibre intake predicts better adherence and more weight loss on calorie-restricted diets (Miketinas 2019). It is what keeps you full on fewer carbs.</p>
      <p style="margin:0"><b>Carbs flex with training.</b> Football is glycolytic, so carbs around sessions protect performance; rest days keep them low so the weekly deficit holds (carbohydrate periodisation, Impey 2018).</p>
      <p style="margin:0"><b>Eat back only part of exercise calories.</b> Wearables and MET tables overestimate energy expenditure by 20–40% for intermittent sport and strength work (Shcherbina 2017), so the app counts 75% of a wristband reading and adds back 50% by default.</p>
      <p style="margin:0"><b>Daily weigh-ins and logging.</b> Frequent self-weighing and consistent food logging are among the strongest predictors of weight-loss success and maintenance (Zheng 2015; Burke 2011). Trust the 7-day trend, not the day.</p>
      <p style="margin:0"><b>Why the game.</b> Immediate feedback, streaks and small visible wins are what habit-formation research says beats willpower (Lally 2010). Quests come from <i>your</i> gaps today; the weekly challenge targets whatever you did worst last week.</p>
    </div>
  </details>
  <details class="card"><summary><h2 style="font-size:20px">Dutch supermarket cheat sheet</h2></summary>
    <div class="foodguide">
      <div><h3 style="color:var(--good)">Reach for</h3><ul><li>Skyr, magere kwark, Hüttenkäse, Arla/Optimel protein kwark</li><li>Kipfilet, kippendij, kalkoen, 5% gehakt, eieren, tonijn in water, witvis, garnalen</li><li>Linzen, kikkererwten, kidneybonen, zwarte bonen</li><li>Volkoren- en roggebrood, havermout, zilvervliesrijst, volkoren pasta</li><li>Broccoli, spinazie, boerenkool, spruitjes, paprika, champignons, sperziebonen</li><li>Frambozen, blauwe bessen, appel, kiwi</li><li>Chiazaad, gebroken lijnzaad (a spoon on kwark adds 3–4 g fibre)</li><li>Tofu, tempeh, edamame</li></ul></div>
      <div><h3 style="color:var(--bad)">Limit</h3><ul><li>Kroketten, frikandel, bitterballen, kaassoufflé</li><li>Stroopwafels, koeken, vla, vruchtenyoghurt, Chocomel</li><li>Hagelslag, big spoons of pindakaas, 48+ kaas as a snack</li><li>Borrelnoten, chips, worst</li><li>Wit brood, croissants, wraps</li><li>Bier (~130 kcal a pilsje), juice, sugary frisdrank</li><li>Fritessaus, mayo, satésaus</li></ul></div>
    </div>
  </details>
  <details class="card"><summary><h2 style="font-size:20px">Your data</h2></summary><div class="row" style="flex-wrap:wrap"><button class="btn sm" id="exp">Export backup</button><label class="btn sm" style="cursor:pointer">Import backup<input type="file" id="imp" accept="application/json" hidden></label><button class="btn sm danger" id="reset">Erase everything</button></div><p class="xs muted" style="margin:8px 0 0">Everything is stored only in this browser on this phone. Export a backup now and then.</p></details>`}
function bindJourneyExtras(el){
  $('#p-keysave').onclick=()=>{const k=$('#p-key').value.trim();if(k&&!/^sk-ant-/.test(k)){toast('That does not look like an Anthropic key');return}S.settings.apiKey=k||null;save();toast(k?'Key saved on this phone':'Key removed');renderJourney()};
  const kc=$('#p-keyclear');if(kc)kc.onclick=()=>{S.settings.apiKey=null;save();renderJourney()};
  el.querySelectorAll('[data-rk]').forEach(inp=>inp.onchange=()=>{const r=REMINDERS.find(x=>x.k===inp.dataset.rk);S.reminders[r.k]=inp.value;save();el.querySelector(`[data-ra="${r.k}"]`).href=gcalUrl({title:r.title,details:'Open Pitch & Plate and log it. Daily reminder.',date:ymd(new Date()),time:inp.value,dur:10,daily:true})});
  $('#exp').onclick=()=>{try{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pitch-plate-${ymd(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}catch(e){toast('Export not available here')}};
  $('#imp').onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j.days)throw 0;S=j;normalize();save();toast('Backup restored');go('today')}catch(err){toast('That file is not a Pitch & Plate backup')}};rd.readAsText(file)};
  $('#reset').onclick=()=>{if(confirm('Erase all food logs, weights and your plan from this phone? Export a backup first if you want to keep it.')){localStorage.removeItem(KEY);S=load();normalize();cur=ymd(new Date());wiz={open:false,step:0,d:null,edit:false};view='plan';render()}};
}
function renderPlan(){if(!S.profile){if(!wiz.open)wiz={open:true,step:0,d:{...DEF},edit:false};renderWizard();return}if(wiz.open){renderWizard();return}renderJourney()}

/* swipe left/right on Today to change day */
(()=>{let x0=null,y0=null;const m=document.querySelector('main');m.addEventListener('touchstart',e=>{if(view!=='today'||!$('#sheet').hidden||(e.target.closest&&e.target.closest('.quests,.seg,.chips,input,textarea,select'))||e.touches[0].clientX<24||e.touches[0].clientX>window.innerWidth-24){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});m.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>70&&Math.abs(dy)<50&&Math.abs(dx)>Math.abs(dy)*2){cur=addDays(cur,dx<0?1:-1);buzz(10);render()}},{passive:true})})();

/* ---------- boot ---------- */
applyTheme();render();setTimeout(checkCelebrations,800);importFromLink();window.addEventListener('hashchange',importFromLink);
})();
</script>
