  el.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{const k=b.dataset.opt;let v=b.dataset.v;if(k==='rate')v=v===''?null:parseFloat(v);else if(k!=='sex')v=parseFloat(v);d[k]=v;renderWizard()});
  el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const id=b.dataset.st,dd=+b.dataset.d;const map={'w-fbw':['fbPerWeek',0,14,1],'w-fbm':['fbMinutes',0,180,15],'w-gyw':['gymPerWeek',0,14,1],'w-gym':['gymMinutes',0,180,15],'w-fib':['fiber',20,60,2]};const [k,lo,hi,step]=map[id];d[k]=clamp((d[k]||0)+dd*step,lo,hi);$('#'+id).textContent=d[k];buzz(8)});
  const wimp=$('#wimp');if(wimp)wimp.onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j.days)throw 0;S=j;normalize();save();wiz.open=false;toast('Backup restored');go('today')}catch(err){toast('That file is not a Pitch & Plate backup')}};rd.readAsText(file)};
  const wb=$('#wback');if(wb)wb.onclick=()=>{if(wiz.step===1&&wiz.edit){wiz.open=false;render();return}wiz.step--;renderWizard()};
  $('#wnext').onclick=()=>{
    if(wiz.step===1){const w=numv($('#w-weight')),h=numv($('#w-height')),a=numv($('#w-age'));if(!(w>=35&&w<=300)){toast('Weight between 35 and 300 kg');return}if(!(h>=120&&h<=230)){toast('Height in cm, e.g. 174');return}if(!(a>=14&&a<=100)){toast('Age between 14 and 100');return}d.startWeight=w;d.height=h;d.age=a}
    if(wiz.step===2){const g=numv($('#w-goal'));if(!(g>=35&&g<=300)){toast('Goal weight in kg');return}const dt=$('#w-date').value;if(!dt||parseYmd(dt)<=new Date()){toast('Pick a date in the future');return}d.goalWeight=g;d.goalDate=dt}
    if(wiz.step===5){finishWizard();return}
    wiz.step++;renderWizard();
  };
}
function finishWizard(){
  const d=wiz.d;const existing=S.profile;
  S.profile={sex:d.sex,age:d.age,height:d.height,startWeight:existing?existing.startWeight:d.startWeight,startDate:existing?existing.startDate:ymd(new Date()),goalWeight:d.goalWeight,goalDate:d.goalDate,rate:d.rate==null?null:d.rate,activity:d.activity,proteinPerKg:d.proteinPerKg,fatPerKg:d.fatPerKg,fiber:d.fiber,eatBack:d.eatBack,fbPerWeek:d.fbPerWeek,fbMinutes:d.fbMinutes,gymPerWeek:d.gymPerWeek,gymMinutes:d.gymMinutes,ageChecked:true};
  if(!existing||Math.abs(d.startWeight-latestWeight())>0.05)day(ymd(new Date())).weight=d.startWeight;
  wiz.open=false;save();buzz([20,30,20]);toast(existing?'Plan updated':'Plan saved. Let’s go.');go('today');
}

/* ---------- JOURNEY ---------- */
function weightSeries(){const P=S.profile;const ws=Object.keys(S.days).filter(d=>S.days[d].weight>0).sort().map(d=>({d,kg:S.days[d].weight}));return [{d:P.startDate,kg:P.startWeight},...ws.filter(w=>w.d!==P.startDate)].sort((a,b)=>a.d<b.d?-1:1)}
function weightChartSvg(pts,pl){
  const P=S.profile;const last=pts[pts.length-1];const togo=last.kg-P.goalWeight;
  const W=360,H=200,L=36,R=14,T=16,B=28;
  const x0=parseYmd(P.startDate).getTime();const etaT=pl.goalEta.getTime(),goalT=parseYmd(P.goalDate).getTime();
  const x1=Math.min(Math.max(goalT,etaT,Date.now()+14*864e5),x0+52*7*864e5);
  const kgMax=Math.max(P.startWeight,...pts.map(p=>p.kg))+1.5,kgMin=Math.min(P.goalWeight,...pts.map(p=>p.kg))-1.5;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=k=>T+(kgMax-k)/(kgMax-kgMin)*(H-T-B);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time with projection"><defs><linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  const step=kgMax-kgMin>20?5:kgMax-kgMin>10?2.5:1;
  for(let k=Math.ceil(kgMin/step)*step;k<=kgMax;k+=step){svg+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(k)}" y2="${Y(k)}"/><text x="${L-5}" y="${Y(k)+4}" text-anchor="end">${k}</text>`}
  svg+=`<line class="goal" x1="${L}" x2="${W-R}" y1="${Y(P.goalWeight)}" y2="${Y(P.goalWeight)}"/><text x="${L+4}" y="${Y(P.goalWeight)-5}" text-anchor="start" style="fill:var(--fib)">goal ${P.goalWeight} kg</text>`;
  const d0=new Date(x0);d0.setDate(1);d0.setMonth(d0.getMonth()+1);
  for(let d=new Date(d0);d.getTime()<=x1;d.setMonth(d.getMonth()+1)){svg+=`<line class="grid" y1="${T}" y2="${H-B}" x1="${X(d.getTime())}" x2="${X(d.getTime())}"/><text x="${X(d.getTime())}" y="${H-8}" text-anchor="middle">${MON[d.getMonth()]}</text>`}
  const lastT=Math.max(parseYmd(last.d).getTime(),Date.now());const projEnd=Math.min(etaT,x1);
  if(togo>0){const kEnd=last.kg-pl.effRate*((projEnd-lastT)/(7*864e5));svg+=`<path class="proj" d="M${X(lastT)} ${Y(last.kg)} L${X(projEnd)} ${Y(Math.max(kEnd,P.goalWeight))}"/>`;
    if(etaT<=x1)svg+=`<circle cx="${X(etaT)}" cy="${Y(P.goalWeight)}" r="4" style="fill:var(--surface);stroke:var(--accent);stroke-width:2"/><text x="${clamp(X(etaT),L+34,W-R-34)}" y="${Y(P.goalWeight)+17}" text-anchor="middle" style="fill:var(--accent-ink)">${MON[pl.goalEta.getMonth()]} ${pl.goalEta.getDate()}</text>`}
  if(goalT>=x0&&goalT<=x1)svg+=`<line x1="${X(goalT)}" x2="${X(goalT)}" y1="${T}" y2="${H-B}" style="stroke:var(--ink2);stroke-dasharray:2 3"/><text x="${clamp(X(goalT),L+44,W-R-44)}" y="${T-4}" text-anchor="middle">${MON[new Date(goalT).getMonth()]} ${new Date(goalT).getDate()} · ${r1(pl.atGoalDate)} kg</text>`;
  if(pts.length>1){const path=pts.map((p,i)=>`${i?'L':'M'}${X(parseYmd(p.d).getTime())} ${Y(p.kg)}`).join(' ');svg+=`<path d="${path} L${X(parseYmd(last.d).getTime())} ${H-B} L${X(parseYmd(pts[0].d).getTime())} ${H-B} Z" fill="url(#gw)"/>`}
  svg+=`<path class="line" d="${pts.map((p,i)=>`${i?'L':'M'}${X(parseYmd(p.d).getTime())} ${Y(p.kg)}`).join(' ')}"/>`;
  pts.forEach((p,i)=>svg+=`<circle class="${i===pts.length-1?'end':'pt'}" cx="${X(parseYmd(p.d).getTime())}" cy="${Y(p.kg)}" r="${i===pts.length-1?4.5:2.5}"/>`);
  return svg+'</svg>';
}
function weeklyTrend(){const t=ymd(new Date());const avg=(from,to)=>{let s=0,n=0;for(let d=from;d<=to;d=addDays(d,1)){const D=S.days[d];if(D&&D.weight>0){s+=D.weight;n++}}return n?{v:s/n,n}:null};const a=avg(addDays(t,-6),t),b=avg(addDays(t,-13),addDays(t,-7));if(!a||!b)return null;return{delta:a.v-b.v,na:a.n,nb:b.n}}
function renderJourney(){
  const P=S.profile,pl=plan();const pts=weightSeries();const last=pts[pts.length-1];
  const lost=P.startWeight-last.kg,toGo=Math.max(0,last.kg-P.goalWeight),total=Math.max(0.1,P.startWeight-P.goalWeight);const pct=clamp(lost/total*100,0,100);
  const weeksIn=Math.max(0,(Date.now()-parseYmd(P.startDate))/(7*864e5));const trend=weeklyTrend();
  const ms=[2,5,10].map(k=>({k:'l'+k,name:`−${k} kg`,w:P.startWeight-k})).concat([{k:'half',name:'Halfway',w:P.startWeight-total/2},{k:'goal',name:`Goal · ${P.goalWeight} kg`,w:P.goalWeight}]).filter(m=>m.w>=P.goalWeight-0.01).sort((a,b)=>b.w-a.w);
  const seen=new Set();const uniq=ms.filter(m=>{const key=r1(m.w);if(seen.has(key))return false;seen.add(key);return true});
  const reachedOn=w=>{for(const p of pts){if(p.kg<=w+0.001)return p.d}return null};
  const eta=w=>{if(last.kg<=w)return null;const wk=(last.kg-w)/pl.effRate;const d=new Date(Math.max(parseYmd(last.d).getTime(),Date.now())+wk*7*864e5);return d};
  const bmi=r1(last.kg/((P.height/100)**2));
  const trackMs=uniq.map(m=>({...m,x:clamp((P.startWeight-m.w)/total*100,0,100),hit:!!reachedOn(m.w)})).sort((a,b)=>a.x-b.x);let lastLx=-100;trackMs.forEach(m=>{m.showLabel=m.k!=='goal'&&m.x-lastLx>=9&&m.x<=92;if(m.showLabel)lastLx=m.x});
  const html=`
  <div class="sechead"><h2>Your journey</h2><button class="btn sm" id="editplan">Edit plan</button></div>
  <div class="card lift glow">
    <div class="row between" style="align-items:flex-start"><div><div class="eyebrow">Lost so far</div><div class="num" style="font-size:52px;line-height:1;color:${lost>0?'var(--accent-ink)':'var(--ink)'}">${lost>0?'−':''}${r1(Math.abs(lost))}<span class="small muted" style="font-family:var(--body);font-weight:500"> kg</span></div></div><div style="text-align:right"><div class="eyebrow">To go</div><div class="num" style="font-size:32px;line-height:1.1">${r1(toGo)}<span class="small muted" style="font-family:var(--body);font-weight:500"> kg</span></div><div class="xs muted">${r0(pct)}% of the way</div></div></div>
    <div class="track"><span class="lab" style="left:0">${P.startWeight} kg</span><span class="lab" style="right:0">${P.goalWeight} kg</span><div class="rail"></div><div class="fill" style="width:${pct}%"></div>${trackMs.map(m=>`<i class="ms ${m.hit?'hit':''}" style="left:calc(${m.x}% - 1px)"></i>${m.showLabel?`<span class="ml" style="left:${m.x}%">${m.k==='half'?'½':m.name.replace(' kg','')}</span>`:''}`).join('')}<div class="me" style="left:${clamp(pct,4,96)}%">⚽</div></div>
    <div class="stats" style="margin-top:18px"><div class="stat"><div class="v">${last.kg}</div><div class="k">now kg</div></div><div class="stat"><div class="v">${r1(weeksIn)}</div><div class="k">weeks in</div></div><div class="stat"><div class="v" style="color:${trend&&trend.delta<0?'var(--accent-ink)':'var(--ink)'}">${trend?(trend.delta>0?'+':'')+r1(trend.delta):'–'}</div><div class="k">kg this week</div></div><div class="stat"><div class="v" style="font-size:20px">${MON[pl.goalEta.getMonth()]} ${pl.goalEta.getDate()}</div><div class="k">goal eta</div></div></div>
    <p class="small muted" style="margin:12px 0 0">${trend?`7-day average vs the week before. Plan expects −${r1(pl.effRate)} kg a week.`:'Weigh in on a few mornings and the weekly trend appears here. Daily numbers bounce; the 7-day average is the truth.'} BMI ${bmi}.</p>
  </div>
  <div class="card">
    <div class="row between" style="margin-bottom:8px"><h2 style="font-size:22px">Weight</h2><button class="btn sm" id="jweigh">Weigh in</button></div>
    ${weightChartSvg(pts,pl)}
    <p class="xs muted" style="margin:10px 0 0">Dotted line: where ${r1(pl.effRate)} kg a week takes you. ${pl.needRate>pl.safeMax+0.02?`${P.goalWeight} kg by ${longDate(parseYmd(P.goalDate))} would need ${r1(pl.needRate)} kg a week, above the safe ceiling, so the plan runs at ~${pl.safeMax}.`:''}</p>
  </div>
  <div class="card">
    <h2 style="font-size:22px;margin-bottom:6px">Milestones</h2>
    <div class="msl">${uniq.map(m=>{const r=reachedOn(m.w);const e=eta(m.w);return `<div class="msr ${r?'hit':''}"><div class="ic">${r?'✓':m.k==='goal'?'★':m.k==='half'?'½':m.name.replace(' kg','')}</div><div><div class="nm">${m.name}</div><div class="sub">${r1(m.w)} kg</div></div><div class="when">${r?`reached ${niceDate(r)}`:e?`~${MON[e.getMonth()]} ${e.getDate()}${e.getFullYear()!==new Date().getFullYear()?' '+e.getFullYear():''}`:'now'}</div></div>`}).join('')}</div>
  </div>
  <div class="card">
    <div class="row between"><h2 style="font-size:22px">Your targets</h2><span class="small muted">${r1(pl.effRate)} kg / week</span></div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-top:12px"><div class="stat"><div class="v">${fmt(pl.kcalRest)}</div><div class="k">kcal rest</div></div><div class="stat"><div class="v" style="color:var(--accent-ink)">${fmt(pl.kcalRest+7.5*pl.w*P.fbMinutes/60*P.eatBack/100)}</div><div class="k">kcal football</div></div><div class="stat"><div class="v">${fmt(pl.deficit)}</div><div class="k">deficit</div></div></div>
    <div class="stats" style="margin-top:8px"><div class="stat"><div class="v" style="color:var(--p)">${pl.protein}</div><div class="k">protein g</div></div><div class="stat"><div class="v" style="color:var(--fib)">${pl.fiber}</div><div class="k">fibre g</div></div><div class="stat"><div class="v" style="color:var(--c)">${Math.max(50,r0((pl.kcalRest-pl.protein*4-pl.fat*9)/4))}</div><div class="k">carbs rest g</div></div><div class="stat"><div class="v" style="color:var(--f)">${pl.fat}</div><div class="k">fat g</div></div></div>
    <p class="xs muted" style="margin:12px 0 0">Football ${P.fbPerWeek}×${P.fbMinutes} min, gym ${P.gymPerWeek}×${P.gymMinutes} min, eat-back ${P.eatBack}%. Tap Edit plan to change anything.</p>
  </div>
  ${journeyExtras()}`;
  const el=$('#v-plan');el.innerHTML=html;
  $('#editplan').onclick=()=>startWizard(true);$('#jweigh').onclick=openWeigh;
  bindJourneyExtras(el);
}
function journeyExtras(){return `
  <details class="card"><summary><h2 style="font-size:20px">Coach &amp; voice</h2></summary>
    <p class="small muted" style="margin:0 0 10px">${sampleFn?'Inside claude.ai the coach and the voice logger run on Claude automatically.':'On your phone the coach and the voice meal logger use your own Anthropic API key (console.anthropic.com → API keys). It stays in this browser and goes straight to Anthropic; a question costs well under a cent. Without it you get the offline rules.'}</p>
    <div class="row"><input type="password" id="p-key" placeholder="sk-ant-…" value="${esc(S.settings.apiKey||'')}" autocomplete="off"><button class="btn sm" id="p-keysave">Save</button>${S.settings.apiKey?'<button class="btn sm ghost" id="p-keyclear">Remove</button>':''}</div>
    <p class="xs muted" style="margin:8px 0 0">Model: Claude Opus 5. It sees your plan, today's log, training and a cheap-protein and fibre price list before every answer. Voice uses your phone's speech recognition (Chrome).</p>
  </details>
  <details class="card"><summary><h2 style="font-size:20px">Daily reminders in Google Calendar</h2></summary>
    <p class="small muted" style="margin:0 0 10px">Each button opens Google Calendar on this phone, signed in as you, with a repeating daily reminder pre-filled. Tap Save there once.</p>
    <div style="display:flex;flex-direction:column;gap:8px">${REMINDERS.map(r=>`<div class="row between" style="gap:8px"><span style="flex:1;font-weight:500;font-size:14px">${r.title}</span><input type="time" data-rk="${r.k}" value="${S.reminders[r.k]||r.time}" style="width:118px"><a class="btn sm" target="_blank" rel="noopener" data-ra="${r.k}" href="${gcalUrl({title:r.title,details:'Open Pitch & Plate and log it. Daily reminder.',date:ymd(new Date()),time:S.reminders[r.k]||r.time,dur:10,daily:true})}">Add</a></div>`).join('')}</div>
  </details>
  <details class="card"><summary><h2 style="font-size:20px">Why these numbers · the science</h2></summary>
    <div class="small" style="display:flex;flex-direction:column;gap:8px">
      <p style="margin:0"><b>Deficit capped at ~1% of body weight per week.</b> Faster than that, trials show proportionally more lean-mass loss and worse training performance; 0.5–1% keeps most muscle, especially with high protein and lifting (Garthe 2011; Helms 2014 review).</p>
      <p style="margin:0"><b>Protein ${r1(S.profile.proteinPerKg)} g per kg.</b> Meta-analyses put the range for preserving or building muscle in a deficit at 1.6–2.4 g/kg/day (Morton 2018; Helms 2014). Protein is also the most satiating macro, which is what makes a 1,500 kcal day bearable.</p>
      <p style="margin:0"><b>Fat floor ${r1(S.profile.fatPerKg)} g per kg.</b> Going much below ~0.5 g/kg for long drags down testosterone and mood; fat stays low, not zero, so calories can go to protein and fibre.</p>
      <p style="margin:0"><b>Fibre ${S.profile.fiber} g.</b> The Gezondheidsraad recommends 30–40 g; higher fibre intake predicts better adherence and more weight loss on calorie-restricted diets (Miketinas 2019). It is what keeps you full on fewer carbs.</p>
      <p style="margin:0"><b>Carbs flex with training.</b> Football is glycolytic, so carbs around sessions protect performance; rest days keep them low so the weekly deficit holds (carbohydrate periodisation, Impey 2018).</p>
      <p style="margin:0"><b>Eat back only part of exercise calories.</b> Wearables and MET tables overestimate energy expenditure by 20–40% for intermittent sport and strength work (Shcherbina 2017), so the app counts 75% of a wristband reading and adds back 50% by default.</p>
      <p style="margin:0"><b>Daily weigh-ins and logging.</b> Frequent self-weighing and consistent food logging are among the strongest predictors of weight-loss success and maintenance (Zheng 2015; Burke 2011). Trust the 7-day trend, not the day.</p>
      <p style="margin:0"><b>Why the game.</b> Immediate feedback, streaks and small visible wins are what habit-formation research says beats willpower (Lally 2010). Quests come from <i>your</i> gaps today; the weekly challenge targets whatever you did worst last week.</p>
    </div>
  </details>
  <details class="card"><summary><h2 style="font-size:20px">Dutch supermarket cheat sheet</h2></summary>
    <div class="foodguide">
      <div><h3 style="color:var(--good)">Reach for</h3><ul><li>Skyr, magere kwark, Hüttenkäse, Arla/Optimel protein kwark</li><li>Kipfilet, kippendij, kalkoen, 5% gehakt, eieren, tonijn in water, witvis, garnalen</li><li>Linzen, kikkererwten, kidneybonen, zwarte bonen</li><li>Volkoren- en roggebrood, havermout, zilvervliesrijst, volkoren pasta</li><li>Broccoli, spinazie, boerenkool, spruitjes, paprika, champignons, sperziebonen</li><li>Frambozen, blauwe bessen, appel, kiwi</li><li>Chiazaad, gebroken lijnzaad (a spoon on kwark adds 3–4 g fibre)</li><li>Tofu, tempeh, edamame</li></ul></div>
      <div><h3 style="color:var(--bad)">Limit</h3><ul><li>Kroketten, frikandel, bitterballen, kaassoufflé</li><li>Stroopwafels, koeken, vla, vruchtenyoghurt, Chocomel</li><li>Hagelslag, big spoons of pindakaas, 48+ kaas as a snack</li><li>Borrelnoten, chips, worst</li><li>Wit brood, croissants, wraps</li><li>Bier (~130 kcal a pilsje), juice, sugary frisdrank</li><li>Fritessaus, mayo, satésaus</li></ul></div>
    </div>
  </details>
  <details class="card"><summary><h2 style="font-size:20px">Your data</h2></summary><div class="row" style="flex-wrap:wrap"><button class="btn sm" id="exp">Export backup</button><label class="btn sm" style="cursor:pointer">Import backup<input type="file" id="imp" accept="application/json" hidden></label><button class="btn sm danger" id="reset">Erase everything</button></div><p class="xs muted" style="margin:8px 0 0">Everything is stored only in this browser on this phone. Export a backup now and then.</p></details>`}
function bindJourneyExtras(el){
  $('#p-keysave').onclick=()=>{const k=$('#p-key').value.trim();if(k&&!/^sk-ant-/.test(k)){toast('That does not look like an Anthropic key');return}S.settings.apiKey=k||null;save();toast(k?'Key saved on this phone':'Key removed');renderJourney()};
  const kc=$('#p-keyclear');if(kc)kc.onclick=()=>{S.settings.apiKey=null;save();renderJourney()};
  el.querySelectorAll('[data-rk]').forEach(inp=>inp.onchange=()=>{const r=REMINDERS.find(x=>x.k===inp.dataset.rk);S.reminders[r.k]=inp.value;save();el.querySelector(`[data-ra="${r.k}"]`).href=gcalUrl({title:r.title,details:'Open Pitch & Plate and log it. Daily reminder.',date:ymd(new Date()),time:inp.value,dur:10,daily:true})});
  $('#exp').onclick=()=>{try{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pitch-plate-${ymd(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}catch(e){toast('Export not available here')}};
  $('#imp').onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j.days)throw 0;S=j;normalize();save();toast('Backup restored');go('today')}catch(err){toast('That file is not a Pitch & Plate backup')}};rd.readAsText(file)};
  $('#reset').onclick=()=>{if(confirm('Erase all food logs, weights and your plan from this phone? Export a backup first if you want to keep it.')){localStorage.removeItem(KEY);S=load();normalize();cur=ymd(new Date());wiz={open:false,step:0,d:null,edit:false};view='plan';render()}};
}
function renderPlan(){if(!S.profile){if(!wiz.open)wiz={open:true,step:0,d:{...DEF},edit:false};renderWizard();return}if(wiz.open){renderWizard();return}renderJourney()}

/* swipe left/right on Today to change day */
(()=>{let x0=null,y0=null;const m=document.querySelector('main');m.addEventListener('touchstart',e=>{if(view!=='today'||!$('#sheet').hidden||(e.target.closest&&e.target.closest('.quests,.seg,.chips,input,textarea,select'))||e.touches[0].clientX<24||e.touches[0].clientX>window.innerWidth-24){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});m.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>70&&Math.abs(dy)<50&&Math.abs(dx)>Math.abs(dy)*2){cur=addDays(cur,dx<0?1:-1);buzz(10);render()}},{passive:true})})();

/* ---------- boot ---------- */
applyTheme();render();setTimeout(checkCelebrations,800);importFromLink();window.addEventListener('hashchange',importFromLink);
})();
