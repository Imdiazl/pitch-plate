<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3EE6B0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1410" media="(prefers-color-scheme: dark)">
<meta name="description" content="Personal macro tracker with Dutch barcode scanning and football-aware calorie targets.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pitch & Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0A1410; --surface:#111E18; --surface2:#182A20; --surface3:#203528; --ink:#EAF5EF; --ink2:#8FB0A1; --line:#223A2D;
  --accent:#3EE6B0; --accent-soft:#113D2E; --on-accent:#04150E; --glow:rgba(62,230,176,.35);
  --p:#6FA3FF; --c:#F2B84B; --f:#FF7B6E; --fib:#B99CFF;
  --good:#3EE6B0; --ok:#4DB8AA; --warn:#F2B84B; --bad:#FF7B6E;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --shadow:0 2px 4px rgba(0,0,0,.35),0 14px 36px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#E9F3EE; --surface:#FFFFFF; --surface2:#DDEEE5; --surface3:#CFE6DA; --ink:#0F2520; --ink2:#4E6B61; --line:#C4DCD1;
  --accent:#0F9A78; --accent-soft:#CDF0E2; --on-accent:#FFFFFF; --glow:rgba(15,154,120,.22);
  --p:#2F6FED; --c:#CF8A0E; --f:#D4574E; --fib:#7B5EC6;
  --good:#0F9A78; --ok:#2A9D8F; --warn:#CF8A0E; --bad:#D4574E;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 8px 24px rgba(20,32,26,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.app{max-width:540px;margin:0 auto;min-height:100dvh;padding:0 0 96px;position:relative}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.brand{font-family:var(--display);font-weight:800;font-size:21px;display:flex;align-items:center;gap:9px;text-transform:uppercase;letter-spacing:.05em}
.brand .mark{width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 0 18px var(--glow)}
.hright{display:flex;align-items:center;gap:8px}
.lvlchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface2);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.03em;border:1px solid var(--line)}
.lvlchip b{color:var(--accent)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* sticky macro strip */
.strip{position:sticky;top:0;z-index:15;margin:0 10px;padding:9px 12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.strip[hidden]{display:none}
.strip .sk{display:flex;flex-direction:column;line-height:1}
.strip .sk .num{font-size:26px}
.strip .sk .num.over{color:var(--bad)}
.strip .sk span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:600;margin-top:2px}
.strip .sm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mb{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--ink2)}
.mb .t{display:flex;justify-content:space-between;font-weight:600}
.mb .t b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.mb .bar{height:5px}
.mb .bar>i{background:var(--mc)}
main{padding:12px 14px 0;display:flex;flex-direction:column;gap:14px}
.view{display:flex;flex-direction:column;gap:14px}
.view[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.lift{box-shadow:var(--shadow)}
.card.glow{background:radial-gradient(120% 90% at 100% 0%,var(--accent-soft) 0%,var(--surface) 55%)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.muted{color:var(--ink2)}.small{font-size:13px}.xs{font-size:12px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 0}
.sechead h2{font-size:22px}
/* date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:6px}
.datenav .dl{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em}
.datenav .dl small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:0}
.datenav .nb{display:flex;gap:6px}
.datenav .nb button{width:40px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-size:20px;display:grid;place-items:center}
.datenav .nb button.today{width:auto;padding:0 12px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em}
/* gauge hero */
.gauge{display:grid;grid-template-columns:1fr;justify-items:center;position:relative}
.gauge svg{width:min(100%,300px);height:auto;display:block}
.gauge .gbg{stroke:var(--surface3);fill:none;stroke-width:16;stroke-linecap:round}
.gauge .gfg{stroke:var(--accent);fill:none;stroke-width:16;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--glow));transition:stroke-dashoffset .6s ease}
.gauge .gfg.over{stroke:var(--bad)}
.gauge .gc{position:absolute;top:34%;text-align:center;display:flex;flex-direction:column;align-items:center}
.gauge .gc .num{font-size:60px;line-height:.9;letter-spacing:-.01em}
.gauge .gc .num.over{color:var(--bad)}
.gauge .gc .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:600;margin-top:4px}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-6px}
.gstat{text-align:center;padding:8px 4px;border-radius:12px;background:var(--surface2)}
.gstat .v{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.gstat .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:600;margin-top:3px}
/* macro rings */
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.mring{display:flex;flex-direction:column;align-items:center;gap:4px}
.mring svg{width:62px;height:62px;transform:rotate(-90deg)}
.mring circle{fill:none;stroke-width:6;stroke-linecap:round}
.mring .b{stroke:var(--surface3)}
.mring .f{stroke:var(--mc);transition:stroke-dashoffset .6s ease}
.mring .wrap{position:relative;display:grid;place-items:center}
.mring .wrap .v{position:absolute;font-family:var(--display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.mring .k{font-size:11px;font-weight:600;color:var(--ink2)}
.mring .k b{color:var(--ink);font-weight:600}
/* quests */
.quests{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-ms-overflow-style:none}
.quests::-webkit-scrollbar{display:none}
.quest{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px 9px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.quest .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--on-accent)}
.quest.done{border-color:var(--accent);background:var(--accent-soft)}
.quest.done .ck{background:var(--accent);border-color:var(--accent)}
.quest .pts{color:var(--ink2);font-weight:500;font-size:12px}
/* season */
.season{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:78px;height:78px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bg{stroke:var(--surface3)}
.ring .fg{stroke:var(--accent);filter:drop-shadow(0 0 6px var(--glow));transition:stroke-dashoffset .6s ease}
.ring .n{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.ring .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600}
.lvl{display:flex;flex-direction:column;gap:6px;min-width:0}
.lvl .t{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.1}
.lvl .xp{height:8px;border-radius:999px;background:var(--surface3);overflow:hidden}
.lvl .xp i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--fib));border-radius:999px}
.lvl .m{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.streak{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px;font-family:var(--display);letter-spacing:.03em}
.streak svg{width:14px;height:14px;fill:currentColor}
.hint{font-size:13px;color:var(--ink2);margin-top:10px}
.hint b{color:var(--ink)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;background:var(--surface2);text-align:center;min-height:92px}
.badge .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:15px;box-shadow:0 0 14px var(--glow)}
.badge .nm{font-size:11px;font-weight:600;line-height:1.2}
.badge .ds{font-size:10px;color:var(--ink2);line-height:1.2}
.badge.locked{opacity:.4;filter:grayscale(1)}
.badge.locked .ic{box-shadow:none}
.chal .bar{height:9px}
/* bars */
.bar{height:10px;border-radius:999px;background:var(--surface3);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .35s ease}
.bar>i.over{background:var(--bad)}
/* nudge */
.nudge{border:1px solid color-mix(in srgb,var(--p) 45%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--p) 18%,var(--surface)),var(--surface));}
.nudge h3{font-size:20px}
.nudge .pct{display:flex;gap:14px;margin:8px 0 10px}
.nudge .pct div{font-size:12px;color:var(--ink2)}
.nudge .pct b{display:block;font-family:var(--display);font-size:24px;color:var(--ink);line-height:1}
/* buttons/inputs */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:13px;padding:11px 15px;font-weight:600;font-size:14px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);white-space:nowrap;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 6px 18px var(--glow)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px;min-height:36px}
.btn.wide{width:100%}
.btn.danger{color:var(--bad)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions .btn{flex-direction:column;gap:6px;padding:12px 6px;font-size:12.5px;min-height:70px}
.actions .btn svg{width:22px;height:22px}
input[type=number],input[type=text],input[type=date],input[type=time],input[type=search],input[type=password],select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0;color:var(--ink);font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* meals timeline */
.meal{padding:0;overflow:hidden}
.meal .mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px}
.meal .mh h3{font-size:20px}
.meal .mh .kc{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:4px 1fr auto auto;align-items:center;gap:12px;padding:10px 14px 10px 16px;border-top:1px solid var(--line)}
.item .dot{width:4px;height:34px;border-radius:2px;background:var(--sc,var(--line))}
.item .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.item .sub i{font-style:normal;padding:1px 6px;border-radius:6px;background:var(--surface2)}
.item .kc{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.item .del{width:36px;height:36px;border-radius:10px;color:var(--ink2);display:grid;place-items:center;font-size:18px}
.item .del:hover{background:var(--surface2);color:var(--bad)}
.item.empty{grid-template-columns:1fr;color:var(--ink2);font-size:13px;padding:6px 16px 12px;border-top:0}
.addrow{display:flex;gap:8px;padding:8px 14px 12px;border-top:1px solid var(--line)}
/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:20}
.tabbar .inner{pointer-events:auto;width:100%;max-width:540px;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom));gap:4px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--accent)}
.tabbar button.scan{color:var(--on-accent);background:var(--accent);border-radius:16px;margin-top:-22px;box-shadow:0 8px 24px var(--glow);padding:12px 2px 9px}
.tabbar button.scan svg{width:26px;height:26px}
/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:13px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{padding:9px 6px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pane[hidden]{display:none}
.pane{display:flex;flex-direction:column;gap:12px}
/* scanner */
.scanbox{position:relative;aspect-ratio:4/3;background:#060b09;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .frame{position:absolute;inset:18% 12%;border:2px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.4)}
.scanbox .frame::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-48px)}to{transform:translateY(48px)}}
.scanbox .idle{position:absolute;inset:0;display:grid;place-items:center;color:#cfd8d2;text-align:center;padding:20px;font-size:14px}
.status{font-size:13px;color:var(--ink2);min-height:18px}
/* results */
.results{display:flex;flex-direction:column;gap:6px}
.res{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:12px;min-height:62px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%}
.res:hover{border-color:var(--accent)}
.res .thumb{width:46px;height:46px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--ink2);font-family:var(--display);font-size:18px;overflow:hidden}
.res .thumb img{width:100%;height:100%;object-fit:cover}
.res .nm{font-weight:600;font-size:14px;line-height:1.25}
.res .sub{font-size:12px;color:var(--ink2);margin-top:2px}
.score{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-weight:800;font-size:18px;color:var(--sc);min-width:36px;justify-content:flex-end}
.score i{width:9px;height:9px;border-radius:50%;background:var(--sc);box-shadow:0 0 8px var(--sc)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink)}
.pill.sc{background:color-mix(in srgb,var(--sc) 20%,transparent);color:var(--sc)}
.ns{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-family:var(--display);font-weight:700;font-size:15px;color:#fff;text-transform:uppercase}
.ns.a{background:#1E8F4E}.ns.b{background:#7AB51D}.ns.c{background:#E3B505;color:#2a2200}.ns.d{background:#EE8100}.ns.e{background:#E63E11}.ns.x{background:var(--surface2);color:var(--ink2)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .bg{position:absolute;inset:0;background:rgba(3,8,6,.6)}
.sheet .panel{position:relative;width:100%;max-width:540px;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.sheet .grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.sheet h2{font-size:25px;line-height:1.1}
.ntable{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ntable div{background:var(--surface2);border-radius:12px;padding:8px 6px;text-align:center}
.ntable .k{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;font-weight:600;white-space:nowrap}
.ntable .v{font-family:var(--display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:8px 13px;min-height:38px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600}
.chips button.on{background:var(--ink);color:var(--bg);border-color:transparent}
.reasons{display:flex;flex-direction:column;gap:4px;font-size:13px;margin:0;padding:0}
.reasons li{list-style:none;display:flex;gap:8px;align-items:baseline}
.reasons li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rc);flex:none;transform:translateY(-1px)}

.sethead{display:grid;grid-template-columns:1fr 50px 50px 58px 30px;gap:6px;font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.lifts{display:flex;flex-direction:column}
.liftrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}

.liftrow .k{font-weight:500}.liftrow .sub{font-size:12px;color:var(--ink2)}
.liftrow .v{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 8px;text-align:center}
.stat .v{font-family:var(--display);font-size:27px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:10.5px;fill:var(--ink2)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--fib);stroke-dasharray:5 4;stroke-width:1.5}
.chart .proj{stroke:var(--accent);stroke-dasharray:2 4;stroke-width:1.8;fill:none}
.chart .line{stroke:var(--ink);stroke-width:2.2;fill:none}
.chart .pt{fill:var(--ink)}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .tgt{stroke:var(--ink);stroke-width:2;opacity:.8}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hits{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.hits i{display:block;height:6px;border-radius:3px;background:var(--surface3)}
.hits i.on{background:var(--hc)}
/* coach */
.coach-last{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;font-size:13.5px;white-space:pre-wrap;max-height:150px;overflow:auto}
.thread{display:flex;flex-direction:column;gap:8px;max-height:48dvh;overflow:auto;padding:2px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;line-height:1.4}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.msg.a.wait{color:var(--ink2);font-style:italic}
.coachbar{display:flex;gap:8px;align-items:flex-end}
.coachbar textarea{flex:1;resize:none;min-height:46px;max-height:120px}

.pick{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pick:first-child{border-top:0}
.pick .nm{font-weight:600;font-size:14px}
.pick .sub{font-size:12px;color:var(--ink2);margin-top:2px}

.callout{border-left:3px solid var(--accent);padding:12px 14px;background:var(--accent-soft);border-radius:0 14px 14px 0;font-size:14px}

.foodguide{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px}
.foodguide ul{margin:6px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:3px}

details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}

.toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}

function proteinPriceContext(){return 'CHEAP PROTEIN IN DUTCH SUPERMARKETS (indicative prices, € per 10 g protein): '+[...PRICES].sort((a,b)=>a.eur10-b.eur10).slice(0,12).map(p=>`${p.name} ${p.store} €${p.price.toFixed(2)} → €${p.eur10.toFixed(2)}/10 g`).join('; ')}

/* ---------- nutrition maths ---------- */
function latestWeightEntry(){const ds=Object.keys(S.days).filter(d=>S.days[d].weight>0).sort();return ds.length?{date:ds[ds.length-1],kg:S.days[ds[ds.length-1]].weight}:null}
function latestWeight(){const e=latestWeightEntry();return e?e.kg:S.profile.startWeight}
function plan(){
  const P=S.profile,w=latestWeight();
  const bmr=P.sex==='m'?10*w+6.25*P.height-5*P.age+5:10*w+6.25*P.height-5*P.age-161;
  const base=bmr*P.activity;
  const fbDaily=P.fbPerWeek*(P.fbMinutes/60)*7.5*w/7;
  const gymDaily=(P.gymPerWeek||0)*((P.gymMinutes||0)/60)*5*w/7;
  const sportDaily=fbDaily+gymDaily;
  const weeksLeft=Math.max(0.5,(parseYmd(P.goalDate)-new Date())/(7*864e5));
  const toLose=w-P.goalWeight;
  const needRate=toLose/weeksLeft;
  const safeMax=Math.round(clamp(w*0.01,0.5,1.0)*20)/20;
  const rate=P.rate??Math.max(0.25,Math.min(needRate,safeMax));
  const deficit=rate*7700/7;
  const floor=P.sex==='m'?1500:1200;
  const kcalRest=Math.max(floor,r0(base-deficit));
  const avgIntake=kcalRest+sportDaily*P.eatBack/100;
  const avgBurn=base+sportDaily;
  const rateAt=eb=>Math.max(0.05,(avgBurn-(kcalRest+sportDaily*eb/100))*7/7700);
  const atDateFor=eb=>Math.max(P.goalWeight,w-rateAt(eb)*weeksLeft);
  const effRate=Math.max(0.05,(avgBurn-avgIntake)*7/7700);
  const weeksToGoal=toLose>0?toLose/effRate:0;
  const goalEta=new Date(Date.now()+weeksToGoal*7*864e5);
  const atGoalDate=Math.max(P.goalWeight,w-effRate*weeksLeft);
  const protein=r0(P.proteinPerKg*w),fat=r0(P.fatPerKg*w);
  return{w,bmr,base,fbDaily,gymDaily,sportDaily,atDateFor,weeksLeft,toLose,needRate,safeMax,rate,deficit,kcalRest,effRate,goalEta,atGoalDate,protein,fat,fiber:P.fiber,floor,avgBurn,floored:base-deficit<floor};
}
function targetsFor(d){const pl=plan();const ex=day(d).ex.filter(e=>e.id!=='sauna').reduce((a,e)=>a+e.kcal,0);const kcal=r0(pl.kcalRest+ex*S.profile.eatBack/100);const c=Math.max(50,r0((kcal-pl.protein*4-pl.fat*9)/4));return{kcal,p:pl.protein,c,f:pl.fat,fib:pl.fiber,ex}}
function totals(d){const t={kcal:0,p:0,c:0,f:0,fib:0,sug:0};for(const it of day(d).foods){const g=it.grams/100;for(const k in t)t[k]+=(it.per100[k]||0)*g}return t}
function fitScore(n){
  if(!n||!(n.kcal>0))return null;
  const pDen=(n.p||0)/n.kcal*100,fibDen=(n.fib||0)/n.kcal*100,fatPct=(n.f||0)*9/n.kcal,sug=n.sug||0;
  const s=clamp(pDen/10,0,1)*45+clamp(fibDen/3,0,1)*20+clamp((0.45-fatPct)/0.25,0,1)*20+clamp((20-sug)/15,0,1)*15;
  return r0(s);
}
function scoreMeta(s){if(s==null)return{label:'No data',color:'var(--ink2)'};if(s>=75)return{label:'Great fit',color:'var(--good)'};if(s>=55)return{label:'Good',color:'var(--ok)'};if(s>=35)return{label:'In moderation',color:'var(--warn)'};return{label:'Doesn’t fit the plan',color:'var(--bad)'}}
function reasons(n){
  const out=[];if(!n||!(n.kcal>0))return out;
  const pDen=(n.p||0)/n.kcal*100,fibDen=(n.fib||0)/n.kcal*100,fatPct=(n.f||0)*9/n.kcal,sug=n.sug||0;
  out.push(pDen>=8?['good',`High protein: ${r1(pDen)} g per 100 kcal`]:pDen>=4?['warn',`Moderate protein: ${r1(pDen)} g per 100 kcal`]:['bad',`Low protein: ${r1(pDen)} g per 100 kcal`]);
  if(n.fib==null)out.push(['warn','Fibre not listed']);else out.push(fibDen>=2.5?['good',`Good fibre: ${r1(n.fib)} g per 100 g`]:n.fib>=3?['warn',`Some fibre: ${r1(n.fib)} g per 100 g`]:['bad',`Little fibre: ${r1(n.fib)} g per 100 g`]);
  out.push(fatPct<=0.25?['good',`Low fat: ${r0(fatPct*100)}% of calories`]:fatPct<=0.4?['warn',`Medium fat: ${r0(fatPct*100)}% of calories`]:['bad',`High fat: ${r0(fatPct*100)}% of calories`]);
  out.push(sug<=5?['good',`Low sugar: ${r1(sug)} g per 100 g`]:sug<=12?['warn',`Some sugar: ${r1(sug)} g per 100 g`]:['bad',`High sugar: ${r1(sug)} g per 100 g`]);
  return out;
}

function openProteinPicks(){
  const T=targetsFor(cur),t=totals(cur);const need=Math.max(0,T.p-t.p),kcalLeft=Math.max(0,T.kcal-t.kcal);
  let mode='fit';

const enc=encodeURIComponent;
function gcalUrl(o){
  const dd=o.date.replace(/-/g,'');let dates;
  if(o.time){const [h,m]=o.time.split(':').map(Number);const st=parseYmd(o.date);st.setHours(h,m,0,0);const en=new Date(st.getTime()+(o.dur||15)*60000);const f=x=>ymd(x).replace(/-/g,'')+'T'+z(x.getHours())+z(x.getMinutes())+'00';dates=f(st)+'/'+f(en)}
  else dates=dd+'/'+addDays(o.date,1).replace(/-/g,'');
  let u=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${enc(o.title)}&dates=${dates}&details=${enc(o.details||'')}&ctz=Europe/Amsterdam`;
  if(o.daily)u+='&recur='+enc('RRULE:FREQ=DAILY');return u;
}
function gcalFoodUrl(d){
  const t=totals(d),T=targetsFor(d),D=day(d);
  let det=`Pitch & Plate · ${fmt(t.kcal)} / ${fmt(T.kcal)} kcal · protein ${r0(t.p)} g · fibre ${r0(t.fib)} g · carbs ${r0(t.c)} g · fat ${r0(t.f)} g\n`;
  for(const m of MEALS){const items=D.foods.filter(f=>f.meal===m);if(!items.length)continue;det+=`\n${m}:\n`+items.map(f=>`• ${f.name} ${f.grams} g (${fmt(f.per100.kcal*f.grams/100)} kcal)`).join('\n')+'\n'}
  if(D.ex.length)det+=`\nTraining:\n`+D.ex.map(e=>`• ${e.name} ${e.min} min${e.id==='sauna'?'':` (${fmt(e.kcal)} kcal)`}`).join('\n')+'\n';
  if(D.weight)det+=`\nWeight: ${D.weight} kg`;
  if(det.length>1600)det=det.slice(0,1590)+'…';
  return gcalUrl({title:`Food log · ${fmt(t.kcal)} kcal · P ${r0(t.p)} g`,details:det,date:d});
}

function ruleCoach(q){
  const T=targetsFor(cur),t=totals(cur);const left=T.kcal-t.kcal,pLeft=T.p-t.p,cLeft=T.c-t.c;
  const ql=q.toLowerCase();
  const words=ql.split(/[,;\/\n+]|\band\b|\ben\b|\bwith\b|\bmet\b|\bor\b|\bof\b/).map(w=>w.replace(/[^a-zà-ü ]/g,'').trim()).filter(Boolean);
  const found=[],unknown=[];
  const STOP=new Set('i ive have has had got there is are at work home lunch dinner breakfast snack what should could can do eat eating the a an some my me now today tonight for from left over please hi hey coach ik heb wat moet kan eten er zijn vandaag nu op het de een mijn'.split(' '));
  for(let w of words){
    const stripped=w.split(' ').filter(x=>!STOP.has(x)).join(' ').trim();
    if(!stripped)continue;
    const key=Object.keys(ALIAS).sort((a,b)=>b.length-a.length).find(k=>w.includes(k));
    if(!key)w=stripped;
    const name=key?ALIAS[key]:null;
    const st=name?STAPLES.find(x=>x.name.toLowerCase().includes(name.toLowerCase())):STAPLES.find(x=>w.length>3&&x.name.toLowerCase().includes(w));
    if(st){if(!found.some(f=>f.st===st))found.push({w,st,score:fitScore(st.per100)||0})}
    else if(w.length>2&&w.split(' ').length<=2)unknown.push(w);
  }
  const out=[];
  if(left<150){
    out.push(left<0?`You're ${fmt(-left)} kcal over today. Stop eating.`:`${fmt(left)} kcal left. That's not a meal, that's a glass of milk.`);
    if(pLeft>15)out.push(`Protein is still ${r0(pLeft)} g short: 150 g magere kwark (72 kcal, 13 g protein), then you're done.`);
    else if(cLeft>20&&left>60)out.push(`If you must: a small banana (~80 kcal) or a cucumber. Then water.`);
    else out.push(`Water, tea, sparkling water or black coffee. If it's late, go to bed. Tomorrow is a new day.`);
    return out.join('\n');
  }
  if(!found.length){
    return `Offline coach here, so I don't know those items${unknown.length?` (${unknown.join(', ')})`:''}. You have ${fmt(left)} kcal and ${r0(pLeft)} g protein left today${T.ex?' and you trained':''}.\nRule of thumb: half the plate vegetables, a palm-and-a-half of lean protein, one fist of carbs${T.ex?' (two on a training day)':''}. Skip sauces and anything fried.\nScan or search the items to log them precisely.`;
  }
  const cat=st=>{const n=st.per100;const pDen=n.p/Math.max(1,n.kcal)*100;if(n.kcal<=45&&(n.fib||0)>=1)return 'veg';if(pDen>=8)return 'protein';if(n.f*9/Math.max(1,n.kcal)>0.5)return 'fat';if(n.c>=12)return 'carb';return 'other'};
  const by={veg:[],protein:[],carb:[],fat:[],other:[]};found.forEach(f=>by[cat(f.st)].push(f));
  const pick=[];let kcal=0,prot=0;const short=st=>st.name.split(' (')[0].split(',')[0];
  const take=(f,g)=>{const n=f.st.per100;pick.push(`${g} g ${short(f.st)} (${fmt(n.kcal*g/100)} kcal, ${r0(n.p*g/100)} g protein)`);kcal+=n.kcal*g/100;prot+=n.p*g/100};
  const budget=Math.min(left,Math.max(350,left*0.6));
  if(by.protein.length){const f=by.protein.sort((a,b)=>b.score-a.score)[0];const need=clamp(pLeft*0.6,25,50);let g=Math.round(need/(f.st.per100.p/100)/10)*10;g=clamp(g,100,250);if(f.st.per100.kcal*g/100>budget*0.7)g=Math.max(80,Math.round(budget*0.7/f.st.per100.kcal*10)*10);take(f,g)}
  for(const f of by.veg.slice(0,2))take(f,150);
  if(by.carb.length){const f=by.carb.sort((a,b)=>b.score-a.score)[0];const room=budget-kcal;let g=Math.round(room/f.st.per100.kcal*10)*10;g=clamp(g,0,T.ex?180:120);if(g>=40)take(f,g);else pick.push(`skip the ${short(f.st).toLowerCase()} today, no room`)}
  const skip=[...by.fat,...by.other].map(f=>short(f.st).toLowerCase());
  out.push(`${fmt(left)} kcal and ${r0(pLeft)} g protein left${T.ex?', and you trained today':''}. Build it like this:`);
  out.push(...pick.map(x=>'• '+x));
  if(skip.length)out.push(`Keep off, or a teaspoon at most: ${skip.join(', ')}.`);
  if(unknown.length)out.push(`Didn't recognise: ${unknown.join(', ')}. Scan it to be sure.`);
  out.push(`About ${fmt(kcal)} kcal and ${r0(prot)} g protein. Leaves ${fmt(left-kcal)} kcal for the rest of the day.`);
  return out.join('\n');
}

function dayScore(d){
  const D=S.days[d];if(!D||!D.foods.length)return null;
  const t=totals(d),T=targetsFor(d);const r=t.kcal/T.kcal;let s=0;
  s+=r>=0.8&&r<=1.05?30:r<0.8?Math.round(18*clamp(r/0.8,0,1)):Math.max(0,Math.round(30-(r-1.05)*200));
  s+=Math.round(25*clamp(t.p/T.p,0,1));s+=Math.round(20*clamp(t.fib/T.fib,0,1));
  const meals=new Set(D.foods.map(f=>f.meal)).size;s+=meals>=3?10:meals*3;

function kcalChart(days){
  const W=360,H=170,L=34,R=10,T=14,B=24;const n=days.length;
  const data=days.map(d=>{const has=S.days[d]&&S.days[d].foods.length;return{d,has,k:has?totals(d).kcal:0,T:targetsFor(d).kcal,p:has?totals(d).p:0,Tp:targetsFor(d).p}});
  const maxV=Math.max(...data.map(x=>Math.max(x.k,x.T)))*1.12||2000;
  const X=i=>L+(i+0.5)*(W-L-R)/n,Y=v=>T+(1-v/maxV)*(H-T-B);const bw=(W-L-R)/n*0.58;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day vs target"><defs><linearGradient id="gk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".45"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--bad)"/><stop offset="1" stop-color="var(--bad)" stop-opacity=".45"/></linearGradient></defs>`;
  const step=maxV>3000?1000:500;for(let v=step;v<maxV;v+=step)s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-5}" y="${Y(v)+3.5}" text-anchor="end">${v>=1000?(v/1000)+'k':v}</text>`;
  data.forEach((x,i)=>{const cx=X(i);if(x.has){const over=x.k>x.T*1.05,under=x.k<x.T*0.8;const h=Math.max(2,Y(0)-Y(x.k));s+=`<rect x="${cx-bw/2}" y="${Y(x.k)}" width="${bw}" height="${h}" rx="4" fill="${over?'url(#gb)':under?'var(--surface3)':'url(#gk)'}" ${under?'stroke="var(--accent)" stroke-width="1.5"':''}/>`}else s+=`<rect x="${cx-bw/2}" y="${Y(0)-2}" width="${bw}" height="2" rx="1" fill="var(--surface3)"/>`;
    s+=`<line class="tgt" x1="${cx-bw/2-3}" x2="${cx+bw/2+3}" y1="${Y(x.T)}" y2="${Y(x.T)}"/>`;
    const dd=parseYmd(x.d);s+=`<text x="${cx}" y="${H-7}" text-anchor="middle" ${x.d===ymd(new Date())?'style="fill:var(--accent);font-weight:700"':''}>${n>14?(dd.getDate()%5===0||i===n-1?dd.getDate():''):DOW[dd.getDay()][0]}</text>`});
  return s+'</svg>';
}
function macroPctChart(days){
  const W=360,H=150,L=34,R=10,T=12,B=24;const n=days.length;
  const X=i=>L+i*(W-L-R)/(n-1),Y=v=>T+(1-clamp(v,0,130)/130)*(H-T-B);
  const pts=days.map((d,i)=>{const has=S.days[d]&&S.days[d].foods.length;if(!has)return null;const t=totals(d),Tt=targetsFor(d);return{i,p:t.p/Tt.p*100,f:t.fib/Tt.fib*100}}).filter(Boolean);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Protein and fibre as percent of target"><defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--p)" stop-opacity=".35"/><stop offset="1" stop-color="var(--p)" stop-opacity="0"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fib)" stop-opacity=".35"/><stop offset="1" stop-color="var(--fib)" stop-opacity="0"/></linearGradient></defs>`;
  for(const v of [50,100]){s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" ${v===100?'style="stroke:var(--ink);opacity:.5;stroke-dasharray:4 4"':''}/><text x="${L-5}" y="${Y(v)+3.5}" text-anchor="end">${v}%</text>`}
  const line=(k,col,grad)=>{if(pts.length<1)return '';const path=pts.map((q,j)=>`${j?'L':'M'}${X(q.i)} ${Y(q[k])}`).join(' ');const area=path+` L${X(pts[pts.length-1].i)} ${Y(0)} L${X(pts[0].i)} ${Y(0)} Z`;return `<path d="${area}" fill="url(#${grad})"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`+pts.map(q=>`<circle cx="${X(q.i)}" cy="${Y(q[k])}" r="3" fill="${col}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')};
  s+=line('f','var(--fib)','gf')+line('p','var(--p)','gp');
  days.forEach((d,i)=>{const dd=parseYmd(d);s+=`<text x="${X(i)}" y="${H-7}" text-anchor="middle">${DOW[dd.getDay()][0]}</text>`});
  return s+'</svg>';
}
function renderProgress(){
  const P=S.profile,pl=plan();

  const last=pts[pts.length-1];

    if(etaT<=x1)svg+=`<circle cx="${X(etaT)}" cy="${Y(P.goalWeight)}" r="4" style="fill:var(--surface);stroke:var(--accent);stroke-width:2"/><text x="${clamp(X(etaT),L+30,W-R-30)}" y="${Y(P.goalWeight)+16}" text-anchor="middle" style="fill:var(--accent)">${MON[pl.goalEta.getMonth()]} ${pl.goalEta.getDate()}</text>`;}

  if(pts.length>1){const path=pts.map((p,i)=>`${i?'L':'M'}${X(parseYmd(p.d).getTime())} ${Y(p.kg)}`).join(' ');svg+=`<path d="${path} L${X(parseYmd(last.d).getTime())} ${H-B} L${X(parseYmd(pts[0].d).getTime())} ${H-B} Z" fill="url(#gw)"/>`}
  svg+=`<path class="line" d="${pts.map((p,i)=>`${i?'L':'M'}${X(parseYmd(p.d).getTime())} ${Y(p.kg)}`).join(' ')}"/>`;
  pts.forEach((p,i)=>svg+=`<circle class="${i===pts.length-1?'end':'pt'}" cx="${X(parseYmd(p.d).getTime())}" cy="${Y(p.kg)}" r="${i===pts.length-1?4.5:2.5}"/>`);
  svg+=`</svg>`;
  /* ranges */
  const today=ymd(new Date());const range=S.settings.range||14;const days=Array.from({length:range},(_,i)=>addDays(today,-(range-1-i)));
  let logged=0,onT=0,sum=0,pHits=0,fHits=0;for(const d of days){const has=S.days[d]&&S.days[d].foods.length;if(!has)continue;logged++;const t=totals(d),Tt=targetsFor(d);sum+=t.kcal;if(t.kcal>=Tt.kcal*0.8&&t.kcal<=Tt.kcal*1.05)onT++;if(t.p>=Tt.p*0.9)pHits++;if(t.fib>=Tt.fib*0.9)fHits++}

  $('#v-progress').innerHTML=seasonCard(false)+`

  if(firstRun)html+=`<div class="banner"><h2>Let's set your plan</h2><p>Prefilled: 98 kg now, 174 cm, 34, goal 75 kg, football three times a week, gym twice. Check and save. Everything stays on this phone.</p></div>`;
  html+=`<div class="card"><div class="eyebrow" style="margin-bottom:10px">You</div>
    <div class="grid3">${f('p-weight','Weight now (kg)','number',P.startWeight,'step="0.1" inputmode="decimal"')}${f('p-height','Height (cm)','number',P.height,'inputmode="numeric"')}${f('p-age','Age','number',P.age,'inputmode="numeric"')}</div>
    <div class="grid2" style="margin-top:10px"><label class="f">Sex (for the calorie formula)<select id="p-sex"><option value="m" ${P.sex==='m'?'selected':''}>Male</option><option value="f" ${P.sex==='f'?'selected':''}>Female</option></select></label>
    <label class="f">Day-to-day activity (excl. sport)<select id="p-act"><option value="1.2" ${P.activity==1.2?'selected':''}>Mostly sitting</option><option value="1.3" ${P.activity==1.3?'selected':''}>Light (desk + some walking)</option><option value="1.4" ${P.activity==1.4?'selected':''}>On my feet a lot</option></select></label></div>
  </div>
  <div class="card"><div class="eyebrow" style="margin-bottom:10px">Goal</div>
    <div class="grid2">${f('p-goal','Goal weight (kg)','number',P.goalWeight,'step="0.1" inputmode="decimal"')}${f('p-date','Target date','date',P.goalDate)}</div>
    <label class="f" style="margin-top:10px">Weekly loss rate<select id="p-rate"><option value="" ${P.rate==null?'selected':''}>Auto (fastest safe rate)</option><option value="0.5" ${P.rate==0.5?'selected':''}>0.5 kg / week · gentle</option><option value="0.75" ${P.rate==0.75?'selected':''}>0.75 kg / week · steady</option><option value="1" ${P.rate==1?'selected':''}>1.0 kg / week · aggressive</option></select></label>
  </div>
  <div class="card"><div class="eyebrow" style="margin-bottom:10px">Football, gym &amp; sauna</div>
    <div class="grid2">${f('p-fbw','Football sessions / week','number',P.fbPerWeek,'inputmode="numeric"')}${f('p-fbm','Minutes each','number',P.fbMinutes,'inputmode="numeric"')}</div>
    <div class="grid2" style="margin-top:10px">${f('p-gyw','Gym sessions / week','number',P.gymPerWeek,'inputmode="numeric"')}${f('p-gym','Minutes each','number',P.gymMinutes,'inputmode="numeric"')}</div>
    <div class="grid2" style="margin-top:10px"><label class="f">Eat back<select id="p-eat"><option value="0" ${P.eatBack==0?'selected':''}>0%</option><option value="50" ${P.eatBack==50?'selected':''}>50%</option><option value="75" ${P.eatBack==75?'selected':''}>75%</option><option value="100" ${P.eatBack==100?'selected':''}>100%</option></select></label><div class="f" style="display:flex;justify-content:flex-end;align-items:flex-end"><span class="xs muted">Sauna burns almost nothing; log it for recovery, not calories.</span></div></div>
    <p class="xs muted" style="margin:8px 0 0">"Eat back" is how much of a logged session's calories get added to that day's food target. 50% is sensible because trackers overestimate. 0% is the fastest, hungriest path.</p>
  </div>
  <div class="card"><div class="eyebrow" style="margin-bottom:10px">Macros</div>
    <div class="grid3"><label class="f">Protein g / kg<select id="p-prot">${[1.6,1.8,2.0,2.2].map(v=>`<option value="${v}" ${P.proteinPerKg==v?'selected':''}>${v}</option>`).join('')}</select></label><label class="f">Fat g / kg<select id="p-fat">${[0.5,0.6,0.7,0.8].map(v=>`<option value="${v}" ${P.fatPerKg==v?'selected':''}>${v}</option>`).join('')}</select></label>${f('p-fib','Fibre g / day','number',P.fiber,'inputmode="numeric"')}</div>
    <p class="xs muted" style="margin:8px 0 0">Protein and fat are fixed in grams; carbs take whatever calories are left, so they rise on training days and fall on rest days.</p>
  </div>
  <button class="btn primary wide" id="p-save">${firstRun?'Save and start':'Save changes'}</button>`;
  if(pl){
    html+=`<div class="card lift"><h2 style="font-size:22px;margin-bottom:8px">Your numbers</h2>
      <dl class="kv"><dt>Resting burn (BMR)</dt><dd>${fmt(pl.bmr)} kcal</dd><dt>Daily burn without sport</dt><dd>${fmt(pl.base)} kcal</dd><dt>Football, averaged per day</dt><dd>+${fmt(pl.fbDaily)} kcal</dd><dt>Gym, averaged per day</dt><dd>+${fmt(pl.gymDaily)} kcal</dd><dt>Planned deficit</dt><dd>${fmt(pl.deficit)} kcal / day</dd><dt>Food target, rest day</dt><dd>${fmt(pl.kcalRest)} kcal</dd><dt>Food target, football day (${S.profile.fbMinutes} min)</dt><dd>${fmt(pl.kcalRest+7.5*pl.w*S.profile.fbMinutes/60*S.profile.eatBack/100)} kcal</dd><dt>Protein</dt><dd>${pl.protein} g</dd><dt>Fat</dt><dd>${pl.fat} g</dd><dt>Fibre</dt><dd>${pl.fiber} g</dd><dt>Carbs, rest day</dt><dd>${Math.max(50,r0((pl.kcalRest-pl.protein*4-pl.fat*9)/4))} g</dd><dt>Expected loss</dt><dd>${r1(pl.effRate)} kg / week</dd></dl>
      ${pl.floored?`<p class="xs muted" style="margin:10px 0 0">The target is held at ${fmt(pl.floor)} kcal, the minimum this app will plan for. Lower costs muscle and makes the football suffer.</p>`:''}
    </div>`;
    if(pl.needRate>pl.safeMax+0.02)html+=`<div class="callout"><b>Reality check on ${longDate(parseYmd(S.profile.goalDate))}.</b> Losing ${r1(pl.toLose)} kg in ${r1(pl.weeksLeft)} weeks means ${r1(pl.needRate)} kg per week. Above about 1% of body weight per week (≈${pl.safeMax} kg for you) you lose muscle, football suffers and it rebounds. The plan runs at the ceiling: roughly <b>${r1(pl.atGoalDate)} kg by that date</b>, <b>${S.profile.goalWeight} kg around ${longDate(pl.goalEta)}</b>.<br><br><b>What moves the needle:</b> eating back 100% of training calories puts you at ~${r1(pl.atDateFor(100))} kg on that date, 50% at ~${r1(pl.atDateFor(50))} kg, 0% at ~${r1(pl.atDateFor(0))} kg. The first two weeks also drop 2–3 kg of water on top.</div>`;
  }
  html+=`<div class="card"><div class="eyebrow" style="margin-bottom:4px">Coach</div>
    <p class="small muted" style="margin:0 0 10px">${sampleFn?'Inside claude.ai the coach runs on Claude automatically.':'On your phone the coach needs your own Anthropic API key (console.anthropic.com → API keys). It is stored only in this browser and sent straight to Anthropic; a question costs well under a cent. Without a key you get the offline rules coach.'}</p>
    <div class="row"><input type="password" id="p-key" placeholder="sk-ant-…" value="${esc(S.settings.apiKey||'')}" autocomplete="off"><button class="btn sm" id="p-keysave">Save</button>${S.settings.apiKey?'<button class="btn sm ghost" id="p-keyclear">Remove</button>':''}</div>
    <p class="xs muted" style="margin:8px 0 0">Model: Claude Opus 5. The coach sees your plan, today's log, training and a cheap-protein price list before every answer.</p>
  </div>
  <div class="card"><div class="eyebrow" style="margin-bottom:4px">Daily reminders in Google Calendar</div>
    <p class="small muted" style="margin:0 0 10px">Each button opens Google Calendar on this phone, signed in as you, with a repeating daily reminder pre-filled. Tap Save there once. Adjust the times first if you like.</p>
    <div style="display:flex;flex-direction:column;gap:8px">${REMINDERS.map(r=>`<div class="row between" style="gap:8px"><span style="flex:1;font-weight:500;font-size:14px">${r.title}</span><input type="time" data-rk="${r.k}" value="${S.reminders[r.k]||r.time}" style="width:124px"><a class="btn sm" target="_blank" rel="noopener" data-ra="${r.k}" href="${gcalUrl({title:r.title,details:'Open Pitch & Plate and log it. Daily reminder.',date:ymd(new Date()),time:S.reminders[r.k]||r.time,dur:10,daily:true})}">Add</a></div>`).join('')}</div>
  </div>
  <div class="card"><details><summary><h2 style="font-size:20px">Why these numbers · the science</h2></summary>
    <div class="small" style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
      <p style="margin:0"><b>Deficit capped at ~1% of body weight per week.</b> Faster than that, trials show proportionally more lean-mass loss and worse training performance; 0.5–1% keeps most muscle, especially with high protein and lifting (Garthe 2011; Helms 2014 review).</p>
      <p style="margin:0"><b>Protein ${S.profile?r1(S.profile.proteinPerKg):1.8} g per kg.</b> Meta-analyses put the range for preserving or building muscle in a deficit at 1.6–2.4 g/kg/day (Morton 2018; Helms 2014). Protein is also the most satiating macro, which is what makes a 1,500 kcal day bearable.</p>
      <p style="margin:0"><b>Fat floor ${S.profile?r1(S.profile.fatPerKg):0.6} g per kg.</b> Going much below ~0.5 g/kg for long drags down testosterone and mood; fat stays low, not zero, so calories can go to protein and fibre.</p>
      <p style="margin:0"><b>Fibre ${S.profile?S.profile.fiber:38} g.</b> The Gezondheidsraad recommends 30–40 g; higher fibre intake predicts better adherence and more weight loss on calorie-restricted diets (Miketinas 2019). It is what keeps you full on fewer carbs.</p>
      <p style="margin:0"><b>Carbs flex with training.</b> Football is glycolytic, so carbs around sessions protect performance; rest days keep them low so the weekly deficit holds (carbohydrate periodisation, Impey 2018).</p>
      <p style="margin:0"><b>Eat back only part of exercise calories.</b> Wearables and MET tables overestimate energy expenditure by 20–40% for intermittent sport and strength work (Shcherbina 2017), so the app counts 75% of a wristband reading and adds back 50% by default.</p>
      <p style="margin:0"><b>Daily weigh-ins and logging.</b> Frequent self-weighing and consistent food logging are among the strongest predictors of weight-loss success and maintenance (Zheng 2015; Burke 2011). Trust the 7-day trend, not the day.</p>
      <p style="margin:0"><b>Why the game.</b> Immediate feedback, streaks and small visible wins are what habit-formation research says beats willpower (Lally 2010). Quests come from <i>your</i> gaps today; the weekly challenge targets whatever you did worst last week.</p>
    </div>
  </details></div>
  <div class="card"><details><summary><h2 style="font-size:20px">Dutch supermarket cheat sheet</h2></summary>
    <div class="foodguide" style="margin-top:10px">
      <div><h3 style="color:var(--good)">Reach for</h3><ul><li>Skyr, magere kwark, Hüttenkäse, Arla/Optimel protein kwark</li><li>Kipfilet, kippendij, kalkoen, 5% gehakt, eieren, tonijn in water, witvis, garnalen</li><li>Linzen, kikkererwten, kidneybonen, zwarte bonen</li><li>Volkoren- en roggebrood, havermout, zilvervliesrijst, volkoren pasta</li><li>Broccoli, spinazie, boerenkool, spruitjes, paprika, champignons, sperziebonen</li><li>Frambozen, blauwe bessen, appel, kiwi</li><li>Chiazaad, gebroken lijnzaad (a spoon on kwark adds 3–4 g fibre)</li><li>Tofu, tempeh, edamame</li></ul></div>
      <div><h3 style="color:var(--bad)">Limit</h3><ul><li>Kroketten, frikandel, bitterballen, kaassoufflé</li><li>Stroopwafels, koeken, vla, vruchtenyoghurt, Chocomel</li><li>Hagelslag, big spoons of pindakaas, 48+ kaas as a snack</li><li>Borrelnoten, chips, worst</li><li>Wit brood, croissants, wraps</li><li>Bier (~130 kcal a pilsje), juice, sugary frisdrank</li><li>Fritessaus, mayo, satésaus</li></ul></div>
    </div>
    <p class="small muted" style="margin:10px 0 0">A day that hits the plan: oats + skyr + berries + lijnzaad; big salad with kipfilet and kikkererwten; fish or lean mince with lentils and a mountain of vegetables; kwark or eggs as snacks. Training days: add a banana and extra volkorenbrood or rice.</p>
  </details></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:8px">Your data</div><div class="row" style="flex-wrap:wrap"><button class="btn sm" id="exp">Export backup</button><label class="btn sm" style="cursor:pointer">Import backup<input type="file" id="imp" accept="application/json" hidden></label><button class="btn sm danger" id="reset">Erase everything</button></div><p class="xs muted" style="margin:8px 0 0">Everything is stored only in this browser on this phone. Export a backup now and then.</p></div>`;
  const el=$('#v-plan');el.innerHTML=html;
  $('#p-save').onclick=()=>{
    const num=(id,min,max)=>{const v=parseFloat($(id).value);return v>=min&&v<=max?v:null};
    const w=num('#p-weight',35,300),h=num('#p-height',120,230),age=num('#p-age',14,100),goal=num('#p-goal',35,300),fib=num('#p-fib',10,80),fbw=num('#p-fbw',0,14),fbm=num('#p-fbm',0,300),gyw=num('#p-gyw',0,14),gym=num('#p-gym',0,300);
    if(!w||!h||!age||!goal||!fib||fbw==null||fbm==null||gyw==null||gym==null){toast('Please check the numbers');return}
    const date=$('#p-date').value;if(!date||parseYmd(date)<=new Date()){toast('Pick a target date in the future');return}
    const rate=$('#p-rate').value;const existing=S.profile;
    S.profile={sex:$('#p-sex').value,age,height:h,startWeight:existing?existing.startWeight:w,startDate:existing?existing.startDate:ymd(new Date()),goalWeight:goal,goalDate:date,rate:rate===''?null:parseFloat(rate),activity:parseFloat($('#p-act').value),proteinPerKg:parseFloat($('#p-prot').value),fatPerKg:parseFloat($('#p-fat').value),fiber:fib,eatBack:parseFloat($('#p-eat').value),fbPerWeek:fbw,fbMinutes:fbm,gymPerWeek:gyw,gymMinutes:gym,ageChecked:true};
    if(!existing||Math.abs(w-latestWeight())>0.05){day(ymd(new Date())).weight=w}
    save();toast('Plan saved');buzz();go('today');
  };
  $('#p-keysave').onclick=()=>{const k=$('#p-key').value.trim();if(k&&!/^sk-ant-/.test(k)){toast('That does not look like an Anthropic key');return}S.settings.apiKey=k||null;save();toast(k?'Key saved on this phone':'Key removed');renderPlan(false)};
  const kc=$('#p-keyclear');if(kc)kc.onclick=()=>{S.settings.apiKey=null;save();renderPlan(false)};
  el.querySelectorAll('[data-rk]').forEach(inp=>inp.onchange=()=>{const r=REMINDERS.find(x=>x.k===inp.dataset.rk);S.reminders[r.k]=inp.value;save();el.querySelector(`[data-ra="${r.k}"]`).href=gcalUrl({title:r.title,details:'Open Pitch & Plate and log it. Daily reminder.',date:ymd(new Date()),time:inp.value,dur:10,daily:true})});
  $('#exp').onclick=()=>{try{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pitch-plate-${ymd(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}catch(e){toast('Export not available here')}};
  $('#imp').onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j.days)throw 0;S=j;normalize();save();toast('Backup restored');go('today')}catch(err){toast('That file is not a Pitch & Plate backup')}};rd.readAsText(file)};
  $('#reset').onclick=()=>{if(confirm('Erase all food logs, weights and your plan from this phone? Export a backup first if you want to keep it.')){localStorage.removeItem(KEY);S=load();normalize();cur=ymd(new Date());view='plan';render()}};
}

/* swipe left/right on Today to change day */
(()=>{let x0=null,y0=null;const m=document.querySelector('main');m.addEventListener('touchstart',e=>{if(view!=='today'||!$('#sheet').hidden){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});m.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>70&&Math.abs(dy)<50){cur=addDays(cur,dx<0?1:-1);buzz(10);render()}},{passive:true})})();

/* ---------- boot ---------- */
applyTheme();render();setTimeout(checkCelebrations,800);
})();
</script>

</body>
