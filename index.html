<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#F2F7F4">
<meta name="description" content="Personal macro tracker with Dutch barcode scanning and football-aware calorie targets.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pitch & Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></noscript>
<style>
:root{
  --bg:#F2F7F4; --surface:#FFFFFF; --surface2:#EAF2ED; --surface3:#DCEAE2; --ink:#10241D; --ink2:#4F685E; --line:#D9E6DF; --line2:#7F9A8E;
  --accent:#0A7F62; --accent-ink:#0A7458; --accent-soft:#D6F3E8; --on-accent:#FFFFFF; --glow:rgba(10,127,98,.22);
  --p:#2F6FED; --c:#B07309; --f:#D9544B; --fib:#7A5BC9;
  --good:#0A7F62; --ok:#258C80; --warn:#B07309; --bad:#D9544B;
  --arc-glow:none; --halo:none; --halo-sm:none;
  --display:'Barlow Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(16,36,29,.05),0 10px 28px rgba(16,36,29,.09);
  color-scheme:only light;
}
:root[data-theme="dark"]{
  --bg:#0A1410; --surface:#111E18; --surface2:#182A20; --surface3:#203528; --ink:#EAF5EF; --ink2:#8FB0A1; --line:#223A2D;
  --accent:#3EE6B0; --accent-ink:#3EE6B0; --accent-soft:#113D2E; --on-accent:#04150E; --glow:rgba(62,230,176,.35); --line2:#567C68;
  --arc-glow:drop-shadow(0 0 8px var(--glow)); --halo:0 0 14px var(--glow); --halo-sm:0 0 10px var(--glow);
  --p:#6FA3FF; --c:#F2B84B; --f:#FF7B6E; --fib:#B99CFF;
  --good:#3EE6B0; --ok:#4DB8AA; --warn:#F2B84B; --bad:#FF7B6E;
  --shadow:0 2px 4px rgba(0,0,0,.35),0 14px 36px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.app{max-width:540px;margin:0 auto;min-height:100dvh;padding:0 0 calc(100px + env(safe-area-inset-bottom));position:relative;overflow-x:clip}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.brand{font-family:var(--display);font-weight:800;font-size:21px;display:flex;align-items:center;gap:9px;text-transform:uppercase;letter-spacing:.05em;flex:none;white-space:nowrap}
.brand .mark{width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--halo)}
.hright{display:flex;align-items:center;gap:8px;min-width:0}
.lvlchip{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 11px;border-radius:999px;background:var(--surface2);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.03em;border:1px solid var(--line)}
.lvlchip[hidden]{display:none}
.lvlchip b{color:var(--accent-ink)}
.iconbtn{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* sticky macro strip */
.strip{position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:15;margin:0 10px;padding:10px 12px;border-radius:14px;background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;box-shadow:var(--shadow)}
.strip[hidden]{display:none}
.strip .sk{display:flex;flex-direction:column;line-height:1}
.strip .sk .num{font-size:26px}
.strip .sk .num.over{color:var(--bad)}
.strip .sk span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:600;margin-top:2px}
.strip .sm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mb{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--ink2)}
.mb .t{display:flex;justify-content:space-between;font-weight:600}
.mb .t b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.mb .bar{height:5px}
.mb .bar>i{background:var(--mc)}
main{padding:12px 16px 0;display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px}
.view[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.lift{box-shadow:var(--shadow)}
.card.glow{background:radial-gradient(120% 90% at 100% 0%,var(--accent-soft) 0%,var(--surface) 55%)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.muted{color:var(--ink2)}.small{font-size:13px}.xs{font-size:12px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 0}
.sechead h2{font-size:22px}
/* date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:6px}
.datenav .dl{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em}
.datenav .dl small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:0}
.datenav .nb{display:flex;gap:6px}
.datenav .nb button{width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-size:20px;display:grid;place-items:center}
.datenav .nb button.today{width:auto;padding:0 12px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em}
/* gauge hero */
.gauge{display:grid;grid-template-columns:1fr;justify-items:center;position:relative}
.gauge svg{width:min(100%,264px);height:auto;display:block}
.gauge .gbg{stroke:var(--surface3);fill:none;stroke-width:16;stroke-linecap:round}
.gauge .gfg{stroke:var(--accent);fill:none;stroke-width:16;stroke-linecap:round;filter:var(--arc-glow);transition:stroke-dashoffset .6s ease}
.gauge .gfg.over{stroke:var(--bad)}
.gauge .gc{position:absolute;top:34%;text-align:center;display:flex;flex-direction:column;align-items:center}
.gauge .gc .num{font-size:54px;line-height:.9;letter-spacing:-.01em}
.gauge .gc .num.over{color:var(--bad)}
.gauge .gc .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:600;margin-top:4px}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-6px}
.gstat{text-align:center;padding:8px 4px;border-radius:12px;background:var(--surface2)}
.gstat .v{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.gstat .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-weight:600;margin-top:3px}
/* macro rings */
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px}
.mring{display:flex;flex-direction:column;align-items:center;gap:4px}
.mring svg{width:68px;height:68px;transform:rotate(-90deg)}
.mring circle{fill:none;stroke-width:6;stroke-linecap:round}
.mring .b{stroke:var(--surface3)}
.mring .f{stroke:var(--mc);transition:stroke-dashoffset .6s ease}
.mring .wrap{position:relative;display:grid;place-items:center}
.mring .wrap .v{position:absolute;font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.mring .k{font-size:12px;font-weight:600;color:var(--ink)}
.mring .k b{color:var(--ink2);font-weight:500}
/* quests */
.quests{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;padding:2px 2px 6px;scrollbar-width:none;-ms-overflow-style:none}
.quests::-webkit-scrollbar{display:none}
.quest{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px 9px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.quest .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink2);display:grid;place-items:center;font-size:12px;color:var(--on-accent)}
.quest.done{border-color:var(--accent);background:var(--accent-soft)}
.quest.done .ck{background:var(--accent);border-color:var(--accent)}
.quest .pts{color:var(--ink2);font-weight:500;font-size:12px}
/* game board */
.board .top3{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.board .sc{display:flex;flex-direction:column;line-height:1}
.board .sc .num{font-size:42px;letter-spacing:-.01em}
.board .sc .num small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--ink2);letter-spacing:0}
.board .sc span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2);font-weight:600;margin-top:4px}
.segbar{display:flex;gap:3px;height:14px;margin:14px 0 10px}
.segbar .sgm{position:relative;background:var(--surface3);border-radius:5px;overflow:hidden}
.segbar .sgm i{position:absolute;left:0;top:0;bottom:0;background:var(--sc);border-radius:5px;transition:width .5s ease}
.segbar .sgm.full{box-shadow:inset 0 0 0 1px var(--sc)}
.seglegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--ink2)}
.seglegend span{display:inline-flex;align-items:center;gap:5px}
.seglegend i{width:8px;height:8px;border-radius:2px;background:var(--sc);display:inline-block}
.seglegend b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.mring{cursor:pointer;border-radius:12px;padding:4px 0}
.mring .left{font-size:11px;font-weight:700;color:var(--mc);color:color-mix(in srgb,var(--mc) 65%,var(--ink));font-variant-numeric:tabular-nums}
.mring .left.over{color:var(--bad);color:color-mix(in srgb,var(--bad) 65%,var(--ink))}
.mring .pts{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface3);color:var(--ink2);font-family:var(--display);letter-spacing:.03em}
.mring .pts.on{background:var(--accent);color:var(--on-accent);box-shadow:var(--halo-sm)}
/* season */
.season{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:78px;height:78px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bg{stroke:var(--surface3)}
.ring .fg{stroke:var(--accent);filter:var(--arc-glow);transition:stroke-dashoffset .6s ease}
.ring .n{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.ring .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600}
.lvl{display:flex;flex-direction:column;gap:6px;min-width:0}
.lvl .row{min-width:0}
.lvl .t{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl .xp{height:8px;border-radius:999px;background:var(--surface3);overflow:hidden}
.lvl .xp i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--fib));border-radius:999px}
.lvl .m{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.streak{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);flex:none;font-weight:800;font-size:14px;font-family:var(--display);letter-spacing:.03em}
.streak svg{width:14px;height:14px;fill:currentColor}
.hint{font-size:13px;color:var(--ink2);margin-top:12px;line-height:1.5}
.hint b{color:var(--ink)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;background:var(--surface2);text-align:center;min-height:92px}
.badge .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:15px;box-shadow:var(--halo)}
.badge .nm{font-size:11px;font-weight:600;line-height:1.2}
.badge .ds{font-size:10px;color:var(--ink2);line-height:1.2}
.badge.locked{filter:grayscale(1)}
.badge.locked .ic{opacity:.35;box-shadow:none}
.badge.locked .nm,.badge.locked .ds{color:var(--ink2)}
.chal .bar{height:9px}
/* bars */
.bar{height:10px;border-radius:999px;background:var(--surface3);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .35s ease}
.bar>i.over{background:var(--bad)}
/* buttons/inputs */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:13px;padding:11px 15px;font-weight:600;font-size:14px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);white-space:nowrap;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 4px 12px var(--glow)}
.btn.ghost{background:transparent}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:10px;min-height:40px}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);color:color-mix(in srgb,var(--bad) 65%,var(--ink))}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.actions .btn{flex-direction:row;gap:8px;padding:12px 10px;font-size:13px;min-height:54px;justify-content:flex-start;white-space:normal;text-align:left;line-height:1.2}
.actions .btn svg{width:22px;height:22px}
input[type=number],input[type=text],input[type=date],input[type=time],input[type=search],input[type=password],select,textarea{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;width:100%;min-width:0;color:var(--ink);font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* meals timeline */
.meal{padding:0;overflow:hidden}
.meal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px}
.meal .mh h3{font-size:20px}
.meal .mh .kc{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:4px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:12px 12px 12px 18px;border-top:1px solid var(--line)}
.item>div{min-width:0}
.item .dot{width:4px;height:34px;border-radius:2px;background:var(--sc,var(--line))}
.item .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.item .sub i{font-style:normal;padding:1px 6px;border-radius:6px;background:var(--surface2)}
.item .kc{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.item .del{width:44px;height:44px;border-radius:10px;color:var(--ink2);display:grid;place-items:center;font-size:20px}
.item .del:hover{background:var(--surface2);color:var(--bad)}
.item.empty{grid-template-columns:1fr;color:var(--ink2);font-size:13px;padding:6px 16px 12px;border-top:0}
.addrow{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.msec{border-top:1px solid var(--line)}
.msh{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 14px 4px 18px;font-size:14.5px}
.msh b{font-weight:600}
.msact{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--ink)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.diary .item{padding-left:18px}
.actions.three{grid-template-columns:repeat(3,1fr)}
.actions.three .btn{flex-direction:column;gap:6px;font-size:12.5px;padding:10px 6px;text-align:center}
/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:20}
.tabbar .inner{pointer-events:auto;width:100%;max-width:540px;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;background:var(--surface);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom));gap:4px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--accent-ink)}
.tabbar button.scan{color:var(--on-accent);background:var(--accent);border-radius:16px;margin-top:-22px;box-shadow:0 6px 18px var(--glow);padding:12px 2px 9px}
.tabbar button.scan svg{width:26px;height:26px}
/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:13px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{padding:11px 6px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,36,29,.14)}
.mealseg button{font-size:13px;padding:10px 4px}
.mealseg button.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.pane[hidden]{display:none}
.pane{display:flex;flex-direction:column;gap:12px}
/* scanner */
.scanbox{position:relative;aspect-ratio:4/3;background:#060b09;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .frame{position:absolute;inset:18% 12%;border:2px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.4)}
.scanbox .frame::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-48px)}to{transform:translateY(48px)}}
.scanbox .idle{position:absolute;inset:0;display:grid;place-items:center;color:#cfd8d2;text-align:center;padding:20px;font-size:14px}
.status{font-size:13px;color:var(--ink2);min-height:18px}
/* results */
.results{display:flex;flex-direction:column;gap:6px}
.res{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:12px;min-height:62px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%}
.res:hover{border-color:var(--accent)}
.res .thumb{width:46px;height:46px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--ink2);font-family:var(--display);font-size:18px;overflow:hidden}
.res .thumb img{width:100%;height:100%;object-fit:cover}
.res .nm{font-weight:600;font-size:14px;line-height:1.25}
.res .sub{font-size:12px;color:var(--ink2);margin-top:2px}
.score{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-weight:800;font-size:18px;color:var(--sc);color:color-mix(in srgb,var(--sc) 65%,var(--ink));min-width:36px;justify-content:flex-end}
.score i{width:9px;height:9px;border-radius:50%;background:var(--sc);box-shadow:0 0 8px var(--sc)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink)}
.pill.sc{background:var(--surface2);background:color-mix(in srgb,var(--sc) 18%,transparent);color:var(--sc);color:color-mix(in srgb,var(--sc) 65%,var(--ink))}
.ns{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-family:var(--display);font-weight:700;font-size:15px;color:#fff;text-transform:uppercase}
.ns.a{background:#1E8F4E}.ns.b{background:#7AB51D}.ns.c{background:#E3B505;color:#2a2200}.ns.d{background:#EE8100}.ns.e{background:#E63E11}.ns.x{background:var(--surface2);color:var(--ink2)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .bg{position:absolute;inset:0;background:rgba(3,8,6,.6)}
.sheet .panel{position:relative;width:100%;max-width:540px;max-height:92dvh;overflow:auto;overscroll-behavior:contain;scroll-padding-bottom:16px;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.sheet .grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.sheet h2{font-size:25px;line-height:1.1}
.ntable{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ntable div{background:var(--surface2);border-radius:12px;padding:8px 6px;text-align:center}
.ntable .k{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:0;font-weight:600;white-space:nowrap}
.ntable .v{font-family:var(--display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:9px 14px;min-height:40px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600}
.chips button.on{background:var(--ink);color:var(--bg);border-color:transparent}
.reasons{display:flex;flex-direction:column;gap:4px;font-size:13px;margin:0;padding:0}
.reasons li{list-style:none;display:flex;gap:8px;align-items:baseline}
.reasons li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rc);flex:none;transform:translateY(-1px)}
.preview{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface2);border-radius:14px;padding:10px 14px}
.preview .num{font-size:32px}
.preview .m{font-size:12.5px;color:var(--ink2);display:flex;gap:10px}
/* exercise */
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exgrid button{background:var(--surface2);border-radius:14px;padding:12px;text-align:left;border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-height:60px}
.exgrid button.on{border-color:var(--accent);background:var(--accent-soft)}
.exgrid b{font-weight:600;font-size:14px}
.exgrid span{font-size:12px;color:var(--ink2)}
.setrow{display:grid;grid-template-columns:1fr 48px 48px 56px 40px;gap:6px;align-items:center}
.setrow input{padding:8px;font-size:14px;border-radius:9px}
.setrow .del{width:40px;height:40px;border-radius:9px;color:var(--ink2);display:grid;place-items:center;font-size:16px}
.sethead{display:grid;grid-template-columns:1fr 48px 48px 56px 40px;gap:6px;font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.lifts{display:flex;flex-direction:column}
.liftrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.liftrow:first-child{border-top:0}
.liftrow .k{font-weight:500}.liftrow .sub{font-size:12px;color:var(--ink2)}
.liftrow .v{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
/* progress */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 8px;text-align:center}
.stat .v{font-family:var(--display);font-size:27px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:12.5px;fill:var(--ink2)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--fib);stroke-dasharray:5 4;stroke-width:1.5}
.chart .proj{stroke:var(--accent);stroke-dasharray:2 4;stroke-width:1.8;fill:none}
.chart .line{stroke:var(--ink);stroke-width:2.2;fill:none}
.chart .pt{fill:var(--ink)}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .tgt{stroke:var(--ink);stroke-width:2;opacity:.8}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hits{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.hits i{display:block;height:6px;border-radius:3px;background:var(--surface3)}
.hits i.on{background:var(--hc)}
/* coach */
.coach-last{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;font-size:13.5px;white-space:pre-wrap;max-height:150px;overflow:auto}
.thread{display:flex;flex-direction:column;gap:8px;max-height:48dvh;overflow:auto;overscroll-behavior:contain;padding:2px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;line-height:1.4}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.msg.a.wait{color:var(--ink2);font-style:italic}
.coachbar{display:flex;gap:8px;align-items:flex-end}
.coachbar textarea{flex:1;resize:none;min-height:46px;max-height:120px}
/* protein picks */
.pick{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pick:first-child{border-top:0}
.pick .nm{font-weight:600;font-size:14px}
.pick .sub{font-size:12px;color:var(--ink2);margin-top:2px}
.pick .eu{font-family:var(--display);font-weight:700;font-size:16px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.micbtn{position:relative;width:46px;padding:0}
.micbtn.listening{background:var(--bad);color:#fff;border-color:transparent;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
.pickrow{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pickrow:nth-of-type(2){border-top:0}
.pickrow input{padding:8px 10px;font-size:14px;border-radius:9px}
.pickrow .pk{text-align:right;font-family:var(--display);font-weight:700;font-size:17px}
.pickrow .del{width:36px;height:36px;border-radius:9px;color:var(--ink2);display:grid;place-items:center;font-size:18px}
.pickrow .qty{display:inline-flex;align-items:center;gap:4px}
.pickrow .qty button{width:36px;height:36px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);font-size:18px;font-weight:600}
.pickrow .qty b{min-width:110px;text-align:center;font-size:13px;font-weight:600;cursor:pointer}
.pickrow .exact-list{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.pickrow .exact-list[hidden]{display:none}
.hidden{display:none!important}
.plancard .big{font-size:40px;line-height:1}
.plancard .arrow{color:var(--accent)}
.grp{padding:14px 0 4px;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0;padding-top:4px}
details.card>summary{padding:2px 0}
details.card[open]>summary{margin-bottom:10px}
.wiz{display:flex;flex-direction:column;gap:16px;min-height:60dvh}
.wiz .dots{display:flex;gap:6px}
.wiz .dots i{width:8px;height:8px;border-radius:50%;background:var(--surface3)}
.wiz .dots i.on{background:var(--accent);width:22px;border-radius:4px}
.wiz h2{font-size:30px;line-height:1.05}
.wiz .lead{margin:0;color:var(--ink2);font-size:15px;line-height:1.5}
.wiznav{display:flex;gap:10px;margin-top:auto;padding-top:8px}
.wiznav .btn{flex:1;min-height:50px;font-size:15px}
.opts{display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;width:100%}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt b{font-size:15px;display:block}
.opt span{font-size:12.5px;color:var(--ink2);display:block;margin-top:2px}
.opt .tag{flex:none;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.bigin{display:flex;align-items:baseline;gap:8px;background:var(--surface2);border:1px solid var(--line2);border-radius:16px;padding:6px 16px}
.bigin input{background:transparent!important;border:0!important;padding:8px 0!important;font-family:var(--display);font-size:38px;font-weight:700;text-align:left;width:100%}
.bigin span{font-size:14px;color:var(--ink2);font-weight:600}
.stepper{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:14px;padding:4px}
.stepper button{width:44px;height:44px;border-radius:11px;background:var(--surface);font-size:22px;font-weight:600;color:var(--ink);border:1px solid var(--line)}
.stepper b{flex:1;text-align:center;font-family:var(--display);font-size:24px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;font-weight:600;color:var(--ink2)}
.track{position:relative;height:70px;margin:16px 4px 4px}
.track .rail{position:absolute;left:0;right:0;top:30px;height:12px;border-radius:999px;background:var(--surface3)}
.track .fill{position:absolute;left:0;top:30px;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--fib))}
.track .ms{position:absolute;top:24px;width:3px;height:24px;border-radius:2px;background:var(--surface);box-shadow:0 0 0 1.5px var(--line2)}
.track .ms.hit{background:var(--accent);box-shadow:none}
.track .ml{position:absolute;top:54px;font-size:10px;color:var(--ink2);transform:translateX(-50%);white-space:nowrap;font-weight:600}
.track .me{position:absolute;top:20px;width:32px;height:32px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);transform:translateX(-50%);display:grid;place-items:center;font-size:13px;box-shadow:var(--shadow);z-index:2}
.track .lab{position:absolute;top:0;font-size:11px;font-weight:700;color:var(--ink2)}
.msl{display:flex;flex-direction:column}
.msr{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.msr:first-child{border-top:0}
.msr .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;background:var(--surface3);color:var(--ink2)}
.msr.hit .ic{background:var(--accent);color:var(--on-accent)}
.msr .nm{font-weight:600;font-size:14px}.msr .sub{font-size:12px;color:var(--ink2)}
.msr .when{font-size:12.5px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.msr.hit .when{color:var(--accent-ink);font-weight:600}
/* plan */
.callout{border-left:3px solid var(--accent);padding:12px 14px;background:var(--accent-soft);border-radius:0 14px 14px 0;font-size:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--ink2)}.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.foodguide{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px}
.foodguide ul{margin:6px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.foodguide h3{font-size:17px}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::after{content:"+";font-family:var(--display);font-size:22px;color:var(--ink2)}
details[open] summary::after{content:"–"}
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast[hidden]{display:none}
.toast .tact{margin-left:10px;padding:4px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-family:var(--display);letter-spacing:.04em;font-size:14px}
.item .main{cursor:pointer;min-width:0}
.item .del{color:var(--bad);opacity:.75}
.item .del:hover{opacity:1}
.banner{background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px}
.banner h2{font-size:26px}
.banner p{margin:0;font-size:14px;color:var(--ink2)}
hr.sep{border:0;border-top:1px solid var(--line);margin:2px 0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.scanbox .frame::after{animation:none}.bar>i,.gauge .gfg,.ring .fg,.mring .f{transition:none}.confetti i{display:none}}
@media (max-width:380px){.gauge .gc .num{font-size:48px}.stats{grid-template-columns:repeat(2,1fr)}.strip .sm{gap:5px}.brand{font-size:19px}.lvlchip{font-size:13px;padding:8px 9px}.lvl .t{font-size:18px}}
</style>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</head>
<body>

<div class="app">
<header class="top">
  <div class="brand"><span class="mark"></span>Pitch &amp; Plate</div>
  <div class="hright"><span class="lvlchip" id="lvlchip" hidden></span><button class="iconbtn" id="themebtn" aria-label="Toggle light / dark"><svg viewBox="0 0 24 24" id="themeicon"><path d="M12 3a9 9 0 1 0 9 9c-4 1-9-4-9-9z"/></svg></button></div>
</header>
<div class="strip" id="strip" hidden></div>

<main>
  <section class="view" id="v-today"></section>
  <section class="view" id="v-add" hidden>
    <div class="seg" id="addseg">
      <button data-pane="scan" class="on">Scan</button>
      <button data-pane="search">Search</button>
      <button data-pane="saved">Saved</button>
      <button data-pane="manual">Manual</button>
    </div>
    <div class="pane" id="p-scan">
      <div class="scanbox" id="scanbox">
        <video id="video" playsinline muted autoplay hidden></video>
        <div class="frame" id="frame" hidden></div>
        <div class="idle" id="scanidle">Point the camera at a barcode.<br>EAN-13 / EAN-8 on Dutch supermarket products.</div>
      </div>
      <div class="row">
        <button class="btn primary" id="scanstart">Start camera</button>
        <button class="btn ghost" id="scanstop" hidden>Stop</button>
        <span class="status" id="scanstatus"></span>
      </div>
      <div class="row">
        <input type="text" inputmode="numeric" enterkeyhint="go" id="codeinput" placeholder="Or type the barcode">
        <button class="btn" id="codego">Look up</button>
      </div>
      <p class="xs muted" style="margin:0">Data from Open Food Facts (nl.openfoodfacts.org): most Albert Heijn, Jumbo, Lidl and Plus products. Missing one? Add it once under Manual and it's remembered.</p>
    </div>
    <div class="pane" id="p-search" hidden>
      <div class="row">
        <input type="search" id="q" placeholder="Search: kwark, kipfilet, linzen, AH skyr…" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="search">
        <button class="btn" id="qgo">Search</button>
        <button class="btn micbtn" id="qsay" aria-label="Say what you ate"><svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button>
      </div>
      <div class="status" id="qstatus"></div>
      <div class="results" id="results"></div>
    </div>
    <div class="pane" id="p-saved" hidden>
      <div class="eyebrow">Favourites</div>
      <div class="results" id="favs"></div>
      <div class="eyebrow" style="margin-top:6px">Recent</div>
      <div class="results" id="recent"></div>
    </div>
    <div class="pane" id="p-manual" hidden>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:10px">Per 100 g (or 100 ml)</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label class="f">Name<input type="text" id="m-name" placeholder="e.g. AH Magere kwark"></label>
          <label class="f">Brand (optional)<input type="text" id="m-brand"></label>
          <div class="grid3">
            <label class="f">kcal<input type="text" id="m-kcal" inputmode="decimal" autocomplete="off"></label>
            <label class="f">Protein g<input type="text" id="m-p" inputmode="decimal" autocomplete="off"></label>
            <label class="f">Carbs g<input type="text" id="m-c" inputmode="decimal" autocomplete="off"></label>
          </div>
          <div class="grid3">
            <label class="f">Fat g<input type="text" id="m-f" inputmode="decimal" autocomplete="off"></label>
            <label class="f">Fibre g<input type="text" id="m-fib" inputmode="decimal" autocomplete="off"></label>
            <label class="f">Sugar g<input type="text" id="m-sug" inputmode="decimal" autocomplete="off"></label>
          </div>
          <label class="f">Barcode (optional, so a future scan finds it)<input type="text" id="m-code" inputmode="numeric"></label>
          <button class="btn primary wide" id="m-go">Continue</button>
        </div>
      </div>
    </div>
  </section>
  <section class="view" id="v-progress" hidden></section>
  <section class="view" id="v-plan" hidden></section>
</main>

<nav class="tabbar" aria-label="Main">
  <div class="inner">
    <button data-view="today" class="on"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>Today</button>
    <button data-view="progress"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M5 15l4-5 4 3 6-7"/></svg>Progress</button>
    <button data-view="add" class="scan" aria-label="Scan or add food"><svg viewBox="0 0 24 24"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"/><path d="M8 9v6M11 9v6M14 9v6M16 9v6"/></svg>Scan</button>
    <button data-view="exercise"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5l3.2 2.3-1.2 3.8H10l-1.2-3.8z"/><path d="M12 7.5V4M15.2 9.8l3.3-1.1M14 13.6l2 3M10 13.6l-2 3M8.8 9.8 5.5 8.7"/></svg>Train</button>
    <button data-view="plan"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></svg>Journey</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="bg" id="sheetbg"></div>
  <div class="panel" id="panel" role="dialog" aria-modal="true"></div>

function renderStrip(){

  const mb=(k,l,col)=>`<div class="mb" style="--mc:${col}"><div class="t"><span>${l}</span><b>${r0(t[k])}<span style="color:var(--ink2);font-weight:500">/${T[k]}</span></b></div><div class="bar"><i class="${t[k]>T[k]*1.05&&(k==='f'||k==='c')?'over':''}" style="width:${clamp(t[k]/T[k]*100,0,100)}%"></i></div></div>`;
  const st=$('#strip');st.hidden=false;
  st.innerHTML=`<div class="sk"><span class="num ${left<0?'over':''}">${fmt(Math.abs(left))}</span><span>${left<0?'over':'kcal left'}${cur!==ymd(new Date())?' · '+niceDate(cur):''}</span></div><div class="sm">${mb('p','P',  'var(--p)')}${mb('fib','Fib','var(--fib)')}${mb('c','C','var(--c)')}${mb('f','Fat','var(--f)')}</div>`;

}

function gaugeSvg(pct,over){const r=84,cx=110,cy=104;const L=Math.PI*r;const d=`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`;return `<svg viewBox="0 0 220 118" aria-hidden="true"><path class="gbg" d="${d}"/><path class="gfg ${over?'over':''}" d="${d}" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-clamp(pct,0,100)/100)}"/></svg>`}
function mring(k,l,col,t,T,pts){const r=25,C=2*Math.PI*r,pct=clamp(t/T,0,1);const left=T-t;const capped=k==='c'||k==='f';const over=capped&&left<-T*0.05;return `<div class="mring" data-m="${k}" role="button" tabindex="0" style="--mc:${col}"><div class="wrap"><svg viewBox="0 0 62 62"><circle class="b" cx="31" cy="31" r="${r}"/><circle class="f" cx="31" cy="31" r="${r}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" ${over?'style="stroke:var(--bad)"':''}/></svg><span class="v">${r0(t)}</span></div><span class="k">${l}</span><span class="left ${over?'over':''}">${over?r0(-left)+' g over':left<=0?'done ✓':r0(left)+' g left'}</span>${pts?`<span class="pts ${pts.earned>=pts.pts?'on':''}">${pts.earned>=pts.pts?'✓ ':''}+${pts.pts}</span>`:''}</div>`}
function scoreParts(d){
  const D=S.days[d]||{foods:[],ex:[]};const has=D.foods.length>0;const t=totals(d),T=targetsFor(d);const r=has?t.kcal/T.kcal:0;
  const kcalPts=!has?0:r>=0.8&&r<=1.05?30:r<0.8?Math.round(18*clamp(r/0.8,0,1)):Math.max(0,Math.round(30-(r-1.05)*200));
  const meals=new Set(D.foods.map(f=>f.meal)).size;
  return [
    {k:'kcal',label:'Calories in range',pts:30,earned:kcalPts,color:'var(--accent)'},
    {k:'p',label:'Protein',pts:25,earned:has?Math.round(25*clamp(t.p/T.p,0,1)):0,color:'var(--p)'},
    {k:'fib',label:'Fibre',pts:20,earned:has?Math.round(20*clamp(t.fib/T.fib,0,1)):0,color:'var(--fib)'},
    {k:'meals',label:'3 meals',pts:10,earned:meals>=3?10:meals*3,color:'var(--c)'},
    {k:'train',label:'Training',pts:10,earned:D.ex.some(e=>e.id!=='sauna')?10:0,color:'var(--ok)'},
    {k:'weigh',label:'Weigh-in',pts:5,earned:D.weight?5:0,color:'var(--ink2)'},
  ];
}
function quests(d){
  const D=S.days[d]||{foods:[],ex:[]};const t=totals(d),T=targetsFor(d);const meals=new Set(D.foods.map(f=>f.meal)).size;
  return [
    {n:'Protein 90%',pts:25,done:t.p>=T.p*0.9,act:()=>openProteinPicks()},
    {n:'Fibre 90%',pts:20,done:t.fib>=T.fib*0.9,act:()=>openPicks('fib')},
    {n:'3 meals logged',pts:10,done:meals>=3,act:()=>go('add')},
    {n:'Train',pts:10,done:D.ex.some(e=>e.id!=='sauna'),act:()=>openExercise()},
    {n:'Weigh-in',pts:5,done:!!D.weight,act:openWeigh},
    {n:'Calories in range',pts:30,done:D.foods.length&&t.kcal>=T.kcal*0.8&&t.kcal<=T.kcal*1.05,act:()=>openCoach('How am I doing today? Be honest.')},
  ];
}

let qSeq=0;
async function doSearch(q){
  const seq=++qSeq,el=$('#results'),st=$('#qstatus');
  const ql=q.toLowerCase();
  const tokens=ql.split(/\s+/).filter(w=>w.length>=2);
  let aliasHits=[];try{aliasHits=ql?findFoods(correctTypos(ql)).map(f=>f.st):[]}catch(e){}
  const score=p=>{if(!ql)return 1;const hay=(p.name+' '+(p.src==='staple'?enName(p):'')+' '+(p.brand||'')).toLowerCase();let sc=0;for(const w of tokens){if(hay.includes(w))sc+=2}if(aliasHits.includes(p))sc+=5;return sc};
  const local=[...Object.values(S.custom),...STAPLES].map(p=>({p,sc:score(p)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).map(x=>x.p);
  if(!q){st.textContent='Common Dutch staples. Type to search Open Food Facts for branded products.';listProducts(el,local.slice(0,40),'');return}
  listProducts(el,local,'');st.textContent='Searching Open Food Facts…';
  try{
    if(q===lastQ&&searchCache[q]){/* same query, reuse */}
    const off=await offSearch(q,24);
    if(seq!==qSeq)return;
    off.sort((a,b)=>(fitScore(b.per100)??-1)-(fitScore(a.per100)??-1));
    listProducts(el,[...local,...off],'No matches. Try a shorter word, or add it manually.');
    st.textContent=`${local.length} staple${local.length===1?'':'s'} · ${off.length} products from Open Food Facts, best fit first`;
  }catch(e){if(seq!==qSeq)return;st.textContent=(local.length?'Built-in foods shown. ':'No built-in match. ')+'Open Food Facts search is busy right now; try again in a minute, say it with the mic, or scan the barcode.'}
}
const searchCache={};
async function offSearch(q,n){
  if(searchCache[q])return searchCache[q];
  const F='code,product_name,product_name_nl,product_name_en,brands,quantity,serving_quantity,nutriscore_grade,nutriments,image_front_small_url';
  const urls=[`https://nl.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=${n}&fields=${F}`,`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=${n}&fields=${F}&countries_tags_en=netherlands`,`https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&langs=nl,en&page_size=${n}&fields=${F}`];
  let lastErr=null;
  for(const u of urls){try{const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();const list=(j.products||j.hits||[]).map(mapOFF).filter(Boolean);if(list.length||u===urls[urls.length-1]){searchCache[q]=list;return list}}catch(e){lastErr=e}}
  throw lastErr||new Error('search failed');
}
function mapOFF(p){

  if(!(kcal>0)&&!(n.proteins_100g>=0))return null;
  const num=v=>v==null||v===''?null:+v;
  return{name:p.product_name_nl||p.product_name||p.product_name_en||'Unnamed product',brand:(p.brands||'').split(',')[0].trim(),barcode:p.code,qty:p.quantity,serving:num(p.serving_quantity),nutri:(p.nutriscore_grade||'').toLowerCase(),img:p.image_front_small_url||null,src:'off',
    per100:{kcal:r1(kcal||0),p:num(n.proteins_100g)??0,c:num(n.carbohydrates_100g)??0,f:num(n.fat_100g)??0,fib:num(n.fiber_100g),sug:num(n.sugars_100g),sat:num(n['saturated-fat_100g'])}};

async function lookup(code){

  if(own){st.textContent='';showProduct(own);return}

const enc=encodeURIComponent;
function gcalUrl(o){
  const dd=o.date.replace(/-/g,'');let dates;
  if(o.time){const [h,m]=o.time.split(':').map(Number);const st=parseYmd(o.date);st.setHours(h,m,0,0);const en=new Date(st.getTime()+(o.dur||15)*60000);const f=x=>ymd(x).replace(/-/g,'')+'T'+z(x.getHours())+z(x.getMinutes())+'00';dates=f(st)+'/'+f(en)}
  else dates=dd+'/'+addDays(o.date,1).replace(/-/g,'');
  let u=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${enc(o.title)}&dates=${dates}&details=${enc(o.details||'')}&ctz=Europe/Amsterdam`;
  if(o.daily)u+='&recur='+enc('RRULE:FREQ=DAILY');return u;
}
function gcalFoodUrl(d){
  const t=totals(d),T=targetsFor(d),D=day(d);
  let det=`Pitch & Plate · ${fmt(t.kcal)} / ${fmt(T.kcal)} kcal · protein ${r0(t.p)} g · fibre ${r0(t.fib)} g · carbs ${r0(t.c)} g · fat ${r0(t.f)} g\n`;
  for(const m of MEALS){const items=D.foods.filter(f=>f.meal===m);if(!items.length)continue;det+=`\n${m}:\n`+items.map(f=>`• ${f.name} ${f.grams} g (${fmt(f.per100.kcal*f.grams/100)} kcal)`).join('\n')+'\n'}
  if(D.ex.length)det+=`\nTraining:\n`+D.ex.map(e=>`• ${e.name} ${e.min} min${e.id==='sauna'?'':` (${fmt(e.kcal)} kcal)`}`).join('\n')+'\n';
  if(D.weight)det+=`\nWeight: ${D.weight} kg`;
  if(det.length>1600)det=det.slice(0,1590)+'…';
  return gcalUrl({title:`Food log · ${fmt(t.kcal)} kcal · P ${r0(t.p)} g`,details:det,date:d});
}

  if(S.settings.apiKey)return askClaudeAPI(S.settings.apiKey,sys,history.map(m=>({role:m.role,content:m.content})));

}
function ruleCoach(q){
  const T=targetsFor(cur),t=totals(cur);const left=T.kcal-t.kcal,pLeft=T.p-t.p,cLeft=T.c-t.c;
  const ql=q.toLowerCase();
  const words=ql.split(/[,;\/\n+]|\band\b|\ben\b|\bwith\b|\bmet\b|\bor\b|\bof\b/).map(w=>w.replace(/[^a-zà-ü ]/g,'').trim()).filter(Boolean);
  const found=[],unknown=[];
  const STOP=new Set('i ive have has had got there is are at work home lunch dinner breakfast snack what should could can do eat eating the a an some my me now today tonight for from left over please hi hey coach ik heb wat moet kan eten er zijn vandaag nu op het de een mijn'.split(' '));
  for(let w of words){
    const stripped=w.split(' ').filter(x=>!STOP.has(x)).join(' ').trim();
    if(!stripped)continue;
    const key=Object.keys(ALIAS).sort((a,b)=>b.length-a.length).find(k=>w.includes(k));
    if(!key)w=stripped;
    const name=key?ALIAS[key]:null;
    const st=name?STAPLES.find(x=>x.name.toLowerCase().includes(name.toLowerCase())):STAPLES.find(x=>w.length>3&&x.name.toLowerCase().includes(w));
    if(st){if(!found.some(f=>f.st===st))found.push({w,st,score:fitScore(st.per100)||0})}
    else if(w.length>2&&w.split(' ').length<=2)unknown.push(w);
  }
  const out=[];
  if(left<150){
    out.push(left<0?`You're ${fmt(-left)} kcal over today. Stop eating.`:`${fmt(left)} kcal left. That's not a meal, that's a glass of milk.`);
    if(pLeft>15)out.push(`Protein is still ${r0(pLeft)} g short: 150 g magere kwark (72 kcal, 13 g protein), then you're done.`);
    else if(cLeft>20&&left>60)out.push(`If you must: a small banana (~80 kcal) or a cucumber. Then water.`);
    else out.push(`Water, tea, sparkling water or black coffee. If it's late, go to bed. Tomorrow is a new day.`);
    return out.join('\n');
  }
  if(!found.length){
    return `Offline coach here, so I don't know those items${unknown.length?` (${unknown.join(', ')})`:''}. You have ${fmt(left)} kcal and ${r0(pLeft)} g protein left today${T.ex?' and you trained':''}.\nRule of thumb: half the plate vegetables, a palm-and-a-half of lean protein, one fist of carbs${T.ex?' (two on a training day)':''}. Skip sauces and anything fried.\nScan or search the items to log them precisely.`;
  }
  const cat=st=>{const n=st.per100;const pDen=n.p/Math.max(1,n.kcal)*100;if(n.kcal<=45&&(n.fib||0)>=1)return 'veg';if(pDen>=8)return 'protein';if(n.f*9/Math.max(1,n.kcal)>0.5)return 'fat';if(n.c>=12)return 'carb';return 'other'};
  const by={veg:[],protein:[],carb:[],fat:[],other:[]};found.forEach(f=>by[cat(f.st)].push(f));
  const pick=[];let kcal=0,prot=0;const short=st=>enName(st);
  const take=(f,g)=>{const n=f.st.per100;pick.push(`${g} g ${short(f.st)} (${fmt(n.kcal*g/100)} kcal, ${r0(n.p*g/100)} g protein)`);kcal+=n.kcal*g/100;prot+=n.p*g/100};
  const budget=Math.min(left,Math.max(350,left*0.6));
  if(by.protein.length){const f=by.protein.sort((a,b)=>b.score-a.score)[0];const need=clamp(pLeft*0.6,25,50);let g=Math.round(need/(f.st.per100.p/100)/10)*10;g=clamp(g,100,250);if(f.st.per100.kcal*g/100>budget*0.7)g=Math.max(80,Math.round(budget*0.7/f.st.per100.kcal*10)*10);take(f,g)}
  for(const f of by.veg.slice(0,2))take(f,150);
  if(by.carb.length){const f=by.carb.sort((a,b)=>b.score-a.score)[0];const room=budget-kcal;let g=Math.round(room/f.st.per100.kcal*10)*10;g=clamp(g,0,T.ex?180:120);if(g>=40)take(f,g);else pick.push(`skip the ${short(f.st).toLowerCase()} today, no room`)}
  const skip=[...by.fat,...by.other].map(f=>short(f.st).toLowerCase());
  out.push(`${fmt(left)} kcal and ${r0(pLeft)} g protein left${T.ex?', and you trained today':''}. Build it like this:`);
  out.push(...pick.map(x=>'• '+x));
  if(skip.length)out.push(`Keep off, or a teaspoon at most: ${skip.join(', ')}.`);
  if(unknown.length)out.push(`Didn't recognise: ${unknown.join(', ')}. Scan it to be sure.`);
  out.push(`About ${fmt(kcal)} kcal and ${r0(prot)} g protein. Leaves ${fmt(left-kcal)} kcal for the rest of the day.`);
  return out.join('\n');
}

let stream=null,scanTimer=null,zx=null,scanning=false;
$('#scanstart').onclick=startScan;$('#scanstop').onclick=stopScan;
async function startScan(){
  const st=$('#scanstatus');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st.textContent='Camera not available here. Open the installed app over https, or type the barcode below.';return}
  try{
    scanning=true;$('#scanstart').hidden=true;$('#scanstop').hidden=false;$('#scanidle').hidden=true;$('#video').hidden=false;$('#frame').hidden=false;
    const video=$('#video');
    if('BarcodeDetector' in window){
      let formats=['ean_13','ean_8','upc_a','upc_e','code_128'];
      try{const sup=await window.BarcodeDetector.getSupportedFormats();formats=formats.filter(f=>sup.includes(f))}catch(e){}
      if(formats.length){
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
        video.srcObject=stream;await video.play();
        const det=new window.BarcodeDetector({formats});st.textContent='Scanning…';
        let fails=0;scanTimer=setInterval(async()=>{if(video.readyState<2||!scanning)return;try{const codes=await det.detect(video);if(codes.length){onCode(codes[0].rawValue)}}catch(e){if(++fails>8){clearInterval(scanTimer);scanTimer=null;st.textContent='Switching scanner…';startZxing(video,st).catch(err=>{st.textContent='Scanner failed: '+(err&&err.message||err);stopScan()})}}},220);
        return;
      }
    }
    await startZxing(video,st);
  }catch(e){st.textContent=e&&e.name==='NotAllowedError'?'Camera permission denied. Allow camera access for this site in Chrome, or type the barcode.':'Could not start the camera: '+(e&&e.message||e);stopScan()}
}
async function startZxing(video,st){
  st.textContent='Loading scanner…';
  if(!window.ZXing){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=res;s.onerror=()=>rej(new Error('Scanner library could not load. Check your connection and try again.'));document.head.appendChild(s)})}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  zx=new window.ZXing.BrowserMultiFormatReader();st.textContent='Scanning…';
  await zx.decodeFromConstraints({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},video,(result)=>{if(result&&scanning)onCode(result.getText())});
}
function onCode(code){if(!scanning)return;stopScan();try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}$('#codeinput').value=code;lookup(code)}
function stopScan(){
  scanning=false;clearInterval(scanTimer);scanTimer=null;
  if(zx){try{zx.reset()}catch(e){}zx=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const v=$('#video');if(v){v.srcObject=null;v.hidden=true}
  $('#frame').hidden=true;$('#scanidle').hidden=false;$('#scanstart').hidden=false;$('#scanstop').hidden=true;
}

function bestKg(name){const n=name.trim().toLowerCase();let best=null;for(const d in S.days)for(const e of S.days[d].ex||[])for(const st of e.sets||[])if(st.n.trim().toLowerCase()===n&&st.kg>0&&(!best||st.kg>best.kg))best={date:d,...st};return best}

const MIC='<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>';
function micSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function startMic(btn,onFinal,onInterim){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Voice input is not available in this browser. Chrome works best.');return null}
  if(btn._rec){try{btn._rec.stop()}catch(e){}return null}
  const r=new SR();r.lang=S.settings.lang||'en-GB';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;let final='';
  btn._rec=r;btn.classList.add('listening');
  r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else interim+=t}if(onInterim)onInterim(final||interim)};
  r.onend=()=>{btn._rec=null;btn.classList.remove('listening');if(final.trim())onFinal(final.trim())};
  r.onerror=e=>{btn._rec=null;btn.classList.remove('listening');if(e.error==='not-allowed')toast('Microphone blocked. Allow it for this site in Chrome.');else if(e.error!=='aborted'&&e.error!=='no-speech')toast('Voice error: '+e.error)};
  try{r.start()}catch(e){btn._rec=null;btn.classList.remove('listening')}
  return r;
}

function parseActivity(text,w){
  const s=text.toLowerCase().replace(/(\d),(\d)/g,'$1.$2');
  let act=ACT.find(a=>a.re.test(s));
  if(!act){if(/\d+\s*(min|minutes?|minuten|uur|hour)/.test(s))act={re:null,name:text.trim().slice(0,40),met:4,id:'other'};else return null}
  let km=null,min=null,m;
  if(m=s.match(/(\d+(?:\.\d+)?)\s*(?:km|kilometer|kilometre|kilometres|kilometers|k(?![a-z]))/))km=parseFloat(m[1]);
  if(m=s.match(/(\d+(?:\.\d+)?)\s*(?:h\b|hr\b|hrs\b|hour|hours|uur|uren)/))min=parseFloat(m[1])*60;
  if(m=s.match(/(\d+)\s*(?:min\b|mins\b|minutes?|minuten|minuut|m\b)/))min=(min||0)+parseInt(m[1],10);
  if(/half an hour|halfuur|half uur|half hour/.test(s))min=min||30;else if(/\ban hour\b|een uur|1 uur/.test(s))min=min||60;
  if(/\b(twice|2x|two times)\b/.test(s)&&min)min*=2;
  let pace=null;if(m=s.match(/(\d{1,2})[:.](\d{2})\s*(?:\/|per|min\/)\s*km/))pace=parseInt(m[1],10)+parseInt(m[2],10)/60;
  if(!min&&km&&pace)min=km*pace;
  if(!min&&km&&act.speed)min=km/act.speed*60;
  let met=act.met;
  if(km&&min){const sp=km/(min/60);
    if(act.name==='E-bike')met=sp<18?4:sp<24?4.8:5.5;
    else if(act.id==='cycle')met=sp<12?3.5:sp<16?5:sp<19?6.8:sp<22?8:sp<26?10:12;
    else if(act.id==='run')met=sp<7?7:sp<8.5?8.3:sp<9.5?9:sp<10.5?9.8:sp<12?11:sp<13.5?11.8:13;
    else if(act.id==='walk')met=sp<3.5?2.8:sp<4.5?3.3:sp<5.5?3.8:sp<6.5?5:7;
    else if(act.id==='swim')met=sp<1.5?5:sp<2.5?6:8;}
  if(/\b(hard|fast|intense|snel|hard gefietst|sprint|tempo)\b/.test(s)&&!(km&&min))met*=1.2;
  if(/\b(easy|slow|relaxed|rustig|langzaam|chill)\b/.test(s)&&!(km&&min))met*=0.85;
  const name=act.name+(km?` ${r1(km)} km`:'');
  let assumed=false;
  if(!min){const d=act.id.startsWith('fb')?(S.profile&&S.profile.fbMinutes)||60:(act.id==='gym'||act.id==='hiit')?(S.profile&&S.profile.gymMinutes)||45:act.id==='sauna'?20:null;if(d){min=d;assumed=true}}
  if(!min)return{act,km,min:null,kcal:null,met,name,needMinutes:true};
  const kcal=act.id==='sauna'?0:Math.round(met*w*min/60);
  return{act,km,min:Math.round(min),kcal,met,name,needMinutes:false,assumed};
}

const MEAL_SYSTEM=`You turn a spoken or typed description of food into logged items for a Dutch user (Ivan) with Dutch supermarket portions. Reply with JSON only, no prose, in exactly this shape:
{"reply":"one short friendly sentence","question":null or "one clarifying question","items":[{"name":"...","count":number or null,"unit":"slice|roll|wrap|egg|piece|glass|cup|bowl|tbsp|handful|ball|null","grams":number,"per100":{"kcal":n,"p":n,"c":n,"f":n,"fib":n,"sug":n}}]}
Use count+unit whenever the food is naturally counted (a roll, 2 slices, half an avocado = count 0.5 unit avocado); grams is always the total weight.
Rules: estimate realistic portions in grams (a slice of bread 35 g, a slice of cheese 20 g, a tablespoon of mayo 15 g, a chicken breast 150 g, a bowl of skyr 250 g, a banana 120 g). per100 = nutrition per 100 g with protein p, carbs c, fat f, fibre fib, sugar sug. If something essential is unknown (what kind of bread, what sauce, how big) ask ONE short question and still return your best-guess items so far. If the conversation already contains your question and an answer, do NOT ask again: finalise the items. Name items in English, keeping a Dutch word in brackets only when it is the real product name (kwark, skyr, kroket, stroopwafel). Understand Dutch input. If the user corrects an amount, removes something or adds something, return the FULL updated items list. Never return markdown.`;
function extractJSON(t){const m=String(t).match(/\{[\s\S]*\}/);if(!m)throw new Error('no JSON');return JSON.parse(m[0])}

function kcalChart(days){
  const W=360,H=170,L=34,R=10,T=14,B=24;const n=days.length;
  const data=days.map(d=>{const has=S.days[d]&&S.days[d].foods.length;return{d,has,k:has?totals(d).kcal:0,T:targetsFor(d).kcal,p:has?totals(d).p:0,Tp:targetsFor(d).p}});
  const maxV=Math.max(...data.map(x=>Math.max(x.k,x.T)))*1.12||2000;
  const X=i=>L+(i+0.5)*(W-L-R)/n,Y=v=>T+(1-v/maxV)*(H-T-B);const bw=(W-L-R)/n*0.58;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day vs target"><defs><linearGradient id="gk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".45"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--bad)"/><stop offset="1" stop-color="var(--bad)" stop-opacity=".45"/></linearGradient></defs>`;
  const step=maxV>3000?1000:500;for(let v=step;v<maxV;v+=step)s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-5}" y="${Y(v)+3.5}" text-anchor="end">${v>=1000?(v/1000)+'k':v}</text>`;
  data.forEach((x,i)=>{const cx=X(i);if(x.has){const over=x.k>x.T*1.05,under=x.k<x.T*0.8;const h=Math.max(2,Y(0)-Y(x.k));s+=`<rect x="${cx-bw/2}" y="${Y(x.k)}" width="${bw}" height="${h}" rx="4" fill="${over?'url(#gb)':under?'var(--surface3)':'url(#gk)'}" ${under?'stroke="var(--accent)" stroke-width="1.5"':''}/>`}else s+=`<rect x="${cx-bw/2}" y="${Y(0)-2}" width="${bw}" height="2" rx="1" fill="var(--surface3)"/>`;
    s+=`<line class="tgt" x1="${cx-bw/2-3}" x2="${cx+bw/2+3}" y1="${Y(x.T)}" y2="${Y(x.T)}"/>`;
    const dd=parseYmd(x.d);s+=`<text x="${cx}" y="${H-7}" text-anchor="middle" ${x.d===ymd(new Date())?'style="fill:var(--accent);font-weight:700"':''}>${n>14?(dd.getDate()%5===0||i===n-1?dd.getDate():''):DOW[dd.getDay()][0]}</text>`});
  return s+'</svg>';
}
function macroPctChart(days){
  const W=360,H=150,L=34,R=10,T=12,B=24;const n=days.length;
  const X=i=>L+i*(W-L-R)/(n-1),Y=v=>T+(1-clamp(v,0,130)/130)*(H-T-B);
  const pts=days.map((d,i)=>{const has=S.days[d]&&S.days[d].foods.length;if(!has)return null;const t=totals(d),Tt=targetsFor(d);return{i,p:t.p/Tt.p*100,f:t.fib/Tt.fib*100}}).filter(Boolean);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Protein and fibre as percent of target"><defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--p)" stop-opacity=".35"/><stop offset="1" stop-color="var(--p)" stop-opacity="0"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fib)" stop-opacity=".35"/><stop offset="1" stop-color="var(--fib)" stop-opacity="0"/></linearGradient></defs>`;
  for(const v of [50,100]){s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" ${v===100?'style="stroke:var(--ink);opacity:.5;stroke-dasharray:4 4"':''}/><text x="${L-5}" y="${Y(v)+3.5}" text-anchor="end">${v}%</text>`}
  const line=(k,col,grad)=>{if(pts.length<1)return '';const path=pts.map((q,j)=>`${j?'L':'M'}${X(q.i)} ${Y(q[k])}`).join(' ');const area=path+` L${X(pts[pts.length-1].i)} ${Y(0)} L${X(pts[0].i)} ${Y(0)} Z`;return `<path d="${area}" fill="url(#${grad})"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`+pts.map(q=>`<circle cx="${X(q.i)}" cy="${Y(q[k])}" r="3" fill="${col}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')};
  s+=line('f','var(--fib)','gf')+line('p','var(--p)','gp');
  days.forEach((d,i)=>{const dd=parseYmd(d);s+=`<text x="${X(i)}" y="${H-7}" text-anchor="middle">${DOW[dd.getDay()][0]}</text>`});
  return s+'</svg>';
}

  <div class="card">
